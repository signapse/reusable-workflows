name: Deploy to EKS with Helm

on:
  workflow_call:
    inputs:
      # AWS Configuration
      aws_region:
        description: 'AWS region where EKS cluster is located'
        required: true
        type: string

      iam_role_arn:
        description: 'IAM role ARN for AWS authentication via OIDC'
        required: true
        type: string

      # EKS Configuration
      cluster_name:
        description: 'EKS cluster name'
        required: true
        type: string

      namespace:
        description: 'Kubernetes namespace to deploy to'
        required: false
        type: string
        default: 'default'

      create_namespace:
        description: 'Create namespace if it does not exist'
        required: false
        type: boolean
        default: true

      # Helm Configuration
      release_name:
        description: 'Helm release name'
        required: true
        type: string

      chart_path:
        description: 'Path to Helm chart (local path or chart reference, e.g., ./helm/chart or bitnami/nginx)'
        required: true
        type: string

      chart_version:
        description: 'Helm chart version (optional, for remote charts)'
        required: false
        type: string
        default: ''

      values_file:
        description: 'Path to Helm values file (e.g., ./helm/values-dev.yaml)'
        required: false
        type: string
        default: ''

      values_inline:
        description: 'Inline Helm values as YAML (will be merged with values_file)'
        required: false
        type: string
        default: ''

      set_values:
        description: 'Helm --set values (one per line, format: key=value)'
        required: false
        type: string
        default: ''

      # Docker Image Override
      image_uri:
        description: 'Docker image URI to override in values (optional, e.g., 123456789.dkr.ecr.us-east-1.amazonaws.com/my-app:v1.0.0)'
        required: false
        type: string
        default: ''

      image_tag:
        description: 'Image tag to override (optional, used with image_uri or separately)'
        required: false
        type: string
        default: ''

      # Deployment Options
      atomic:
        description: 'If set, upgrade process rolls back changes made in case of failed upgrade (--atomic)'
        required: false
        type: boolean
        default: true

      wait:
        description: 'Wait for all Pods to be ready before marking release as successful'
        required: false
        type: boolean
        default: true

      timeout:
        description: 'Time to wait for Kubernetes operations (e.g., 5m, 10m)'
        required: false
        type: string
        default: '10m'

      force:
        description: 'Force resource updates through a replacement strategy'
        required: false
        type: boolean
        default: false

      dry_run:
        description: 'Perform a dry-run (simulate deployment without applying)'
        required: false
        type: boolean
        default: false

      # Helm Repository (for remote charts)
      helm_repo_name:
        description: 'Helm repository name (required for remote charts)'
        required: false
        type: string
        default: ''

      helm_repo_url:
        description: 'Helm repository URL (required for remote charts)'
        required: false
        type: string
        default: ''

      # Additional Options
      post_deploy_command:
        description: 'Custom kubectl/helm command to run after deployment (e.g., kubectl get pods -n namespace)'
        required: false
        type: string
        default: ''

permissions:
  id-token: write
  contents: read

jobs:
  deploy-helm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.iam_role_arn }}
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: ${{ inputs.aws_region }}

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: 'latest'

      - name: Configure kubectl for EKS
        env:
          CLUSTER_NAME: ${{ inputs.cluster_name }}
          AWS_REGION: ${{ inputs.aws_region }}
        run: |
          echo "=========================================="
          echo "🔧 Configuring kubectl for EKS"
          echo "=========================================="
          echo "Cluster: ${CLUSTER_NAME}"
          echo "Region: ${AWS_REGION}"
          echo "=========================================="

          aws eks update-kubeconfig \
            --name "${CLUSTER_NAME}" \
            --region "${AWS_REGION}"

          echo "✅ kubectl configured"

          # Verify connection
          echo ""
          echo "📋 Cluster Info:"
          kubectl cluster-info
          echo ""

      - name: Create namespace
        if: inputs.create_namespace
        env:
          NAMESPACE: ${{ inputs.namespace }}
        run: |
          echo "🔧 Ensuring namespace exists: ${NAMESPACE}"
          kubectl create namespace "${NAMESPACE}" --dry-run=client -o yaml | kubectl apply -f -
          echo "✅ Namespace ready"

      - name: Add Helm repository
        if: inputs.helm_repo_name != '' && inputs.helm_repo_url != ''
        env:
          HELM_REPO_NAME: ${{ inputs.helm_repo_name }}
          HELM_REPO_URL: ${{ inputs.helm_repo_url }}
        run: |
          echo "📦 Adding Helm repository"
          helm repo add "${HELM_REPO_NAME}" "${HELM_REPO_URL}"
          helm repo update
          echo "✅ Helm repository added and updated"

      - name: Prepare Helm values
        id: prepare-values
        env:
          VALUES_INLINE: ${{ inputs.values_inline }}
          IMAGE_URI: ${{ inputs.image_uri }}
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
          SET_VALUES: ${{ inputs.set_values }}
        run: |
          echo "🔧 Preparing Helm values"

          # Create temporary values file for inline values
          if [ -n "${VALUES_INLINE}" ]; then
            echo "Creating inline values file..."
            printf '%s\n' "${VALUES_INLINE}" > /tmp/values-inline.yaml
            echo "inline_values_file=/tmp/values-inline.yaml" >> $GITHUB_OUTPUT
          else
            echo "inline_values_file=" >> $GITHUB_OUTPUT
          fi

          # Build --set arguments
          SET_ARGS=""

          # Add image URI if provided
          if [ -n "${IMAGE_URI}" ]; then
            # Parse repository and tag from full URI
            IMAGE_REPO=$(echo "${IMAGE_URI}" | cut -d: -f1)
            IMAGE_TAG=$(echo "${IMAGE_URI}" | cut -d: -f2)
            SET_ARGS="$SET_ARGS --set image.repository=$IMAGE_REPO --set image.tag=$IMAGE_TAG"
          fi

          # Add image tag if provided separately
          if [ -n "${INPUT_IMAGE_TAG}" ]; then
            SET_ARGS="$SET_ARGS --set image.tag=${INPUT_IMAGE_TAG}"
          fi

          # Add custom --set values
          if [ -n "${SET_VALUES}" ]; then
            while IFS= read -r line; do
              if [ -n "$line" ]; then
                SET_ARGS="$SET_ARGS --set $line"
              fi
            done <<< "${SET_VALUES}"
          fi

          echo "set_args=$SET_ARGS" >> $GITHUB_OUTPUT
          echo "✅ Values prepared"

          if [ -n "$SET_ARGS" ]; then
            echo "Set arguments: $SET_ARGS"
          fi

      # The helm commands are built as arrays rather than strings passed to
      # eval, so input values are never re-parsed as shell code. set_args is
      # still word-split, as before.
      - name: Helm diff (dry-run preview)
        if: inputs.dry_run == false
        continue-on-error: true
        env:
          RELEASE_NAME: ${{ inputs.release_name }}
          CHART_PATH: ${{ inputs.chart_path }}
          NAMESPACE: ${{ inputs.namespace }}
          VALUES_FILE: ${{ inputs.values_file }}
          INLINE_VALUES_FILE: ${{ steps.prepare-values.outputs.inline_values_file }}
          SET_ARGS: ${{ steps.prepare-values.outputs.set_args }}
          CHART_VERSION: ${{ inputs.chart_version }}
        run: |
          echo "=========================================="
          echo "📊 Helm Diff Preview"
          echo "=========================================="

          # Install helm-diff plugin if not present
          if ! helm plugin list | grep -q diff; then
            echo "Installing helm-diff plugin..."
            helm plugin install https://github.com/databus23/helm-diff || true
          fi

          # Build helm upgrade command for diff
          HELM_CMD=(helm diff upgrade "${RELEASE_NAME}" "${CHART_PATH}")
          HELM_CMD+=(--namespace "${NAMESPACE}")
          HELM_CMD+=(--allow-unreleased)

          # Add values file
          if [ -n "${VALUES_FILE}" ]; then
            HELM_CMD+=(--values "${VALUES_FILE}")
          fi

          # Add inline values
          if [ -n "${INLINE_VALUES_FILE}" ]; then
            HELM_CMD+=(--values "${INLINE_VALUES_FILE}")
          fi

          # Add set arguments
          if [ -n "${SET_ARGS}" ]; then
            read -r -a SET_ARGS_ARR <<< "${SET_ARGS}"
            HELM_CMD+=("${SET_ARGS_ARR[@]}")
          fi

          # Add chart version if specified
          if [ -n "${CHART_VERSION}" ]; then
            HELM_CMD+=(--version "${CHART_VERSION}")
          fi

          echo "Running: ${HELM_CMD[*]}"
          "${HELM_CMD[@]}" || echo "⚠️  Diff preview failed (this may be expected for new releases)"

          echo "=========================================="

      - name: Deploy with Helm
        id: helm-deploy
        env:
          RELEASE_NAME: ${{ inputs.release_name }}
          CHART_PATH: ${{ inputs.chart_path }}
          NAMESPACE: ${{ inputs.namespace }}
          DRY_RUN: ${{ inputs.dry_run }}
          VALUES_FILE: ${{ inputs.values_file }}
          INLINE_VALUES_FILE: ${{ steps.prepare-values.outputs.inline_values_file }}
          SET_ARGS: ${{ steps.prepare-values.outputs.set_args }}
          CHART_VERSION: ${{ inputs.chart_version }}
          ATOMIC: ${{ inputs.atomic }}
          WAIT: ${{ inputs.wait }}
          FORCE: ${{ inputs.force }}
          TIMEOUT: ${{ inputs.timeout }}
        run: |
          echo "=========================================="
          echo "🚀 Deploying with Helm"
          echo "=========================================="
          echo "Release: ${RELEASE_NAME}"
          echo "Chart: ${CHART_PATH}"
          echo "Namespace: ${NAMESPACE}"
          echo "Dry-run: ${DRY_RUN}"
          echo "=========================================="

          # Build helm upgrade command
          HELM_CMD=(helm upgrade --install "${RELEASE_NAME}" "${CHART_PATH}")
          HELM_CMD+=(--namespace "${NAMESPACE}")

          # Add values file
          if [ -n "${VALUES_FILE}" ]; then
            HELM_CMD+=(--values "${VALUES_FILE}")
          fi

          # Add inline values
          if [ -n "${INLINE_VALUES_FILE}" ]; then
            HELM_CMD+=(--values "${INLINE_VALUES_FILE}")
          fi

          # Add set arguments
          if [ -n "${SET_ARGS}" ]; then
            read -r -a SET_ARGS_ARR <<< "${SET_ARGS}"
            HELM_CMD+=("${SET_ARGS_ARR[@]}")
          fi

          # Add chart version if specified
          if [ -n "${CHART_VERSION}" ]; then
            HELM_CMD+=(--version "${CHART_VERSION}")
          fi

          # Add deployment options
          if [ "${ATOMIC}" == "true" ]; then
            HELM_CMD+=(--atomic)
          fi

          if [ "${WAIT}" == "true" ]; then
            HELM_CMD+=(--wait)
          fi

          if [ "${FORCE}" == "true" ]; then
            HELM_CMD+=(--force)
          fi

          if [ "${DRY_RUN}" == "true" ]; then
            HELM_CMD+=(--dry-run)
          fi

          HELM_CMD+=(--timeout "${TIMEOUT}")

          # Execute helm command
          echo ""
          echo "Executing: ${HELM_CMD[*]}"
          echo ""
          "${HELM_CMD[@]}"

          echo ""
          echo "✅ Helm deployment completed"

      - name: Verify deployment
        if: inputs.dry_run == false && inputs.wait == true
        env:
          RELEASE_NAME: ${{ inputs.release_name }}
          NAMESPACE: ${{ inputs.namespace }}
        run: |
          echo "=========================================="
          echo "🔍 Verifying Deployment"
          echo "=========================================="

          # Get Helm release status
          echo "📋 Helm Release Status:"
          helm status "${RELEASE_NAME}" --namespace "${NAMESPACE}"

          echo ""
          echo "📋 Kubernetes Resources:"

          # Get all resources for this release
          kubectl get all -n "${NAMESPACE}" -l "app.kubernetes.io/instance=${RELEASE_NAME}" || \
          kubectl get all -n "${NAMESPACE}" -l "app=${RELEASE_NAME}" || \
          kubectl get all -n "${NAMESPACE}"

          echo "=========================================="

      - name: Run post-deployment command
        if: inputs.post_deploy_command != '' && inputs.dry_run == false
        env:
          POST_DEPLOY_COMMAND: ${{ inputs.post_deploy_command }}
        run: |
          echo "=========================================="
          echo "🔧 Running post-deployment command"
          echo "=========================================="
          echo "Command: ${POST_DEPLOY_COMMAND}"
          echo ""

          # The caller-supplied command is executed as shell code by design.
          eval "${POST_DEPLOY_COMMAND}"

          echo "✅ Post-deployment command completed"

      - name: Get Pod logs (on failure)
        if: failure() && inputs.dry_run == false
        continue-on-error: true
        env:
          RELEASE_NAME: ${{ inputs.release_name }}
          NAMESPACE: ${{ inputs.namespace }}
        run: |
          echo "=========================================="
          echo "📋 Fetching Pod logs for debugging"
          echo "=========================================="

          # Try different label selectors
          kubectl get pods -n "${NAMESPACE}" -l "app.kubernetes.io/instance=${RELEASE_NAME}" -o name | while read pod; do
            echo ""
            echo "Logs for $pod:"
            kubectl logs $pod -n "${NAMESPACE}" --tail=50 || true
          done

          kubectl get pods -n "${NAMESPACE}" -l "app=${RELEASE_NAME}" -o name | while read pod; do
            echo ""
            echo "Logs for $pod:"
            kubectl logs $pod -n "${NAMESPACE}" --tail=50 || true
          done

          echo "=========================================="

      - name: Deployment Summary
        if: always()
        env:
          RELEASE_NAME: ${{ inputs.release_name }}
          CHART_PATH: ${{ inputs.chart_path }}
          NAMESPACE: ${{ inputs.namespace }}
          CLUSTER_NAME: ${{ inputs.cluster_name }}
          AWS_REGION: ${{ inputs.aws_region }}
          IMAGE_URI: ${{ inputs.image_uri }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          echo ""
          echo "=========================================="
          echo "✨ Deployment Summary"
          echo "=========================================="
          echo "Release Name: ${RELEASE_NAME}"
          echo "Chart: ${CHART_PATH}"
          echo "Namespace: ${NAMESPACE}"
          echo "Cluster: ${CLUSTER_NAME}"
          echo "Region: ${AWS_REGION}"
          echo "Image URI: ${IMAGE_URI}"
          echo "Dry-run: ${DRY_RUN}"
          echo "Timestamp: $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
          echo "=========================================="
