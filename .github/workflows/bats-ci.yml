name: bats CI
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'actions/release-train/**'
      - '.github/workflows/bats-ci.yml'

jobs:
  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bats + jq
        run: |
          sudo apt-get update
          sudo apt-get install -y bats jq
      - name: Run bats
        working-directory: actions/release-train/test
        run: bats .
