name: bats CI
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'actions/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bats + jq
        run: |
          sudo apt-get update
          sudo apt-get install -y bats jq
      - name: Run bats
        working-directory: actions/release-train/test
        run: bats .
      - name: Check workflow links exist
        # Pull requests check the checked-in allow-list
        # (actions/release-train/workflow-links.allowlist) without credentials,
        # because PR code must not receive the token. On push to main, where the
        # code is trusted, WORKFLOW_LINKS_TOKEN (read access to every linked repo)
        # makes it ask the GitHub API instead; without the secret it stays on the
        # allow-list.
        env:
          GH_TOKEN: ${{ github.event_name == 'push' && secrets.WORKFLOW_LINKS_TOKEN || '' }}
        run: actions/release-train/scripts/check-workflow-links.sh
