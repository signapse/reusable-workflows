name: bats CI
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'actions/release-train/**'
      - 'actions/migration-safety/**'
      - '.github/workflows/bats-ci.yml'

jobs:
  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bats + jq
        run: |
          sudo apt-get update
          sudo apt-get install -y bats jq
      - name: Shellcheck migration-safety
        run: shellcheck -x actions/migration-safety/scripts/*.sh
      - name: Run bats
        run: bats actions/release-train/test actions/migration-safety/test
