name: bats CI
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'actions/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bats + jq
        run: |
          sudo apt-get update
          sudo apt-get install -y bats jq
      - name: Run bats
        working-directory: actions/release-train/test
        run: bats .
      - name: Check workflow links exist (allow-list, no credentials)
        env:
          GH_TOKEN: ''
        run: actions/release-train/scripts/check-workflow-links.sh

  # Live check on main only. WORKFLOW_LINKS_TOKEN (Contents: read on every
  # linked repo) must be an environment secret on `workflow-links`, whose
  # deployment branches are restricted to main, so a PR's own copy of this file
  # cannot read it. Without the secret this falls back to the allow-list.
  workflow-links-api:
    needs: bats
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: workflow-links
    steps:
      - uses: actions/checkout@v4
      - name: Check workflow links exist (GitHub API)
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_LINKS_TOKEN }}
        run: actions/release-train/scripts/check-workflow-links.sh
