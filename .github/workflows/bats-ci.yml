name: bats CI
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'actions/release-train/**'
      - '.github/workflows/**'

jobs:
  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bats + jq
        run: |
          sudo apt-get update
          sudo apt-get install -y bats jq
      - name: Run bats
        working-directory: actions/release-train/test
        run: bats .
      - name: Check workflow links exist
        # With WORKFLOW_LINKS_TOKEN set (read access to every linked repo) this
        # asks the GitHub API; without it, it checks the checked-in allow-list
        # actions/release-train/workflow-links.allowlist.
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_LINKS_TOKEN }}
        run: actions/release-train/scripts/check-workflow-links.sh
