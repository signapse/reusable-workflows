name: Go CI (Reusable)

on:
  workflow_call:
    inputs:
      go_version:
        description: 'Go version to use (leave empty to auto-detect from go.mod)'
        required: false
        type: string
        default: ''

      golangci_lint_version:
        description: 'golangci-lint version'
        required: false
        type: string
        default: 'latest'

      run_lint:
        description: 'Run lint and format check'
        required: false
        type: boolean
        default: true

      run_tests:
        description: 'Run tests with coverage'
        required: false
        type: boolean
        default: true

      run_security_scan:
        description: 'Run Trivy filesystem scan'
        required: false
        type: boolean
        default: true

      run_docker_build:
        description: 'Test Docker build (no push)'
        required: false
        type: boolean
        default: false

      run_docker_lint:
        description: 'Lint Dockerfile'
        required: false
        type: boolean
        default: false

      dockerfile_path:
        description: 'Path to Dockerfile'
        required: false
        type: string
        default: './Dockerfile'

      docker_context:
        description: 'Docker build context path'
        required: false
        type: string
        default: '.'

      enable_private_repos:
        description: 'Enable access to private repos using PAT'
        required: false
        type: boolean
        default: false

      goprivate:
        description: 'GOPRIVATE environment variable value'
        required: false
        type: string
        default: 'github.com/signapse/*'

    secrets:
      github_pat:
        description: 'GitHub PAT for accessing private repositories'
        required: false

permissions:
  contents: read

jobs:
  lint:
    if: ${{ inputs.run_lint }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go_version || null }}
          go-version-file: ${{ inputs.go_version == '' && 'go.mod' || '' }}
          cache: true

      - name: Verify private-repo credentials are available
        if: ${{ inputs.enable_private_repos }}
        env:
          GITHUB_PAT: ${{ secrets.github_pat }}
        run: |
          # A whitespace-only secret is as unusable as an empty one and would
          # produce the same credential-less rewrite, so trim before testing.
          if [ -n "$(printf '%s' "$GITHUB_PAT" | tr -d '[:space:]')" ]; then
            echo "github_pat is present; private module access will be configured."
            exit 0
          fi

          echo "::error title=github_pat is empty::enable_private_repos is true but no github_pat was passed to go-ci.yml. See this step's log for the likely cause and the fix."

          {
            echo "=================================================================="
            echo "  go-ci.yml: required secret 'github_pat' is empty"
            echo "=================================================================="
            echo
            echo "This workflow was called with input:"
            echo "    enable_private_repos: true"
            echo "but secret 'github_pat' resolved to an EMPTY string."
            echo
            echo "Failing here deliberately. If we continued, the next step would run:"
            echo "    git config --global url.\"https://@github.com/\".insteadOf \"https://github.com/\""
            echo "which is a URL rewrite containing no credential. The job would then"
            echo "fail much later, at the first private module fetch, with this"
            echo "misleading error:"
            echo "    fatal: could not read Password for 'https://github.com': terminal prompts disabled"
            echo
            echo "MOST LIKELY CAUSE"
            echo "  The calling workflow references a REPOSITORY-level secret owned by a"
            echo "  different repository. Repository secrets are not shared across"
            echo "  repositories, so such a reference is not an error - it silently"
            echo "  expands to an empty string."
            echo "  A known example is HUB_PLATFORM_API_PAT, which is not resolvable"
            echo "  from every repo that references it."
            echo
            echo "FIX - pass the organisation-level MACHINE_TOKEN in the caller:"
            echo
            printf '    secrets:\n'
            printf '      github_pat: %s{ secrets.MACHINE_TOKEN }}\n' '${'
            echo
            echo "ALTERNATIVE - if this repository has no private Go dependencies,"
            echo "switch the feature off instead of passing a token:"
            echo
            printf '    with:\n'
            printf '      enable_private_repos: false\n'
            echo
            echo "=================================================================="
          } >&2
          exit 1

      - name: Configure access to private repos
        if: ${{ inputs.enable_private_repos }}
        run: |
          git config --global url."https://${{ secrets.github_pat }}@github.com/".insteadOf "https://github.com/"
        env:
          GOPRIVATE: ${{ inputs.goprivate }}

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: ${{ inputs.golangci_lint_version }}
          install-mode: goinstall
          args: --timeout=5m

      - name: Check formatting
        run: |
          unformatted=$(gofmt -s -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not formatted:"
            echo "$unformatted"
            exit 1
          fi

  test:
    if: ${{ inputs.run_tests }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go_version || null }}
          go-version-file: ${{ inputs.go_version == '' && 'go.mod' || '' }}
          cache: true

      - name: Verify private-repo credentials are available
        if: ${{ inputs.enable_private_repos }}
        env:
          GITHUB_PAT: ${{ secrets.github_pat }}
        run: |
          # A whitespace-only secret is as unusable as an empty one and would
          # produce the same credential-less rewrite, so trim before testing.
          if [ -n "$(printf '%s' "$GITHUB_PAT" | tr -d '[:space:]')" ]; then
            echo "github_pat is present; private module access will be configured."
            exit 0
          fi

          echo "::error title=github_pat is empty::enable_private_repos is true but no github_pat was passed to go-ci.yml. See this step's log for the likely cause and the fix."

          {
            echo "=================================================================="
            echo "  go-ci.yml: required secret 'github_pat' is empty"
            echo "=================================================================="
            echo
            echo "This workflow was called with input:"
            echo "    enable_private_repos: true"
            echo "but secret 'github_pat' resolved to an EMPTY string."
            echo
            echo "Failing here deliberately. If we continued, the next step would run:"
            echo "    git config --global url.\"https://@github.com/\".insteadOf \"https://github.com/\""
            echo "which is a URL rewrite containing no credential. The job would then"
            echo "fail much later, at the first private module fetch, with this"
            echo "misleading error:"
            echo "    fatal: could not read Password for 'https://github.com': terminal prompts disabled"
            echo
            echo "MOST LIKELY CAUSE"
            echo "  The calling workflow references a REPOSITORY-level secret owned by a"
            echo "  different repository. Repository secrets are not shared across"
            echo "  repositories, so such a reference is not an error - it silently"
            echo "  expands to an empty string."
            echo "  A known example is HUB_PLATFORM_API_PAT, which is not resolvable"
            echo "  from every repo that references it."
            echo
            echo "FIX - pass the organisation-level MACHINE_TOKEN in the caller:"
            echo
            printf '    secrets:\n'
            printf '      github_pat: %s{ secrets.MACHINE_TOKEN }}\n' '${'
            echo
            echo "ALTERNATIVE - if this repository has no private Go dependencies,"
            echo "switch the feature off instead of passing a token:"
            echo
            printf '    with:\n'
            printf '      enable_private_repos: false\n'
            echo
            echo "=================================================================="
          } >&2
          exit 1

      - name: Configure access to private repos
        if: ${{ inputs.enable_private_repos }}
        run: |
          git config --global url."https://${{ secrets.github_pat }}@github.com/".insteadOf "https://github.com/"
        env:
          GOPRIVATE: ${{ inputs.goprivate }}

      - name: Download dependencies
        run: |
          go mod download
          go mod verify
        env:
          GOPRIVATE: ${{ inputs.goprivate }}

      - name: Run tests
        run: go test ./... -v -race -coverprofile=coverage.out
        env:
          GOPRIVATE: ${{ inputs.goprivate }}

      - name: Generate coverage report
        run: go tool cover -html=coverage.out -o coverage.html

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.html
          retention-days: 14

  security-scan:
    if: ${{ inputs.run_security_scan }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create shared Trivy ignore file
        run: |
          # Append centrally-managed CVE exceptions so every caller inherits them.
          # Review periodically and remove entries once upstream fixes land.
          cat >> .trivyignore <<'EOF'
          # github.com/docker/docker (indirect, test-only)
          # CVE-2026-34040 - Moby authorization bypass. No upstream fix yet.
          CVE-2026-34040
          EOF

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          format: 'table'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          trivyignores: '.trivyignore'

  docker-build:
    if: ${{ inputs.run_docker_build }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify private-repo credentials are available
        if: ${{ inputs.enable_private_repos }}
        env:
          GITHUB_PAT: ${{ secrets.github_pat }}
        run: |
          # A whitespace-only secret is as unusable as an empty one and would
          # produce the same credential-less rewrite, so trim before testing.
          if [ -n "$(printf '%s' "$GITHUB_PAT" | tr -d '[:space:]')" ]; then
            echo "github_pat is present; private module access will be configured."
            exit 0
          fi

          echo "::error title=github_pat is empty::enable_private_repos is true but no github_pat was passed to go-ci.yml. See this step's log for the likely cause and the fix."

          {
            echo "=================================================================="
            echo "  go-ci.yml: required secret 'github_pat' is empty"
            echo "=================================================================="
            echo
            echo "This workflow was called with input:"
            echo "    enable_private_repos: true"
            echo "but secret 'github_pat' resolved to an EMPTY string."
            echo
            echo "Failing here deliberately. If we continued, the next step would run:"
            echo "    git config --global url.\"https://@github.com/\".insteadOf \"https://github.com/\""
            echo "which is a URL rewrite containing no credential, and the Docker build"
            echo "would fail later at the first private module fetch with this"
            echo "misleading error:"
            echo "    fatal: could not read Password for 'https://github.com': terminal prompts disabled"
            echo
            echo "MOST LIKELY CAUSE"
            echo "  The calling workflow references a REPOSITORY-level secret owned by a"
            echo "  different repository. Repository secrets are not shared across"
            echo "  repositories, so such a reference is not an error - it silently"
            echo "  expands to an empty string."
            echo "  A known example is HUB_PLATFORM_API_PAT, which is not resolvable"
            echo "  from every repo that references it."
            echo
            echo "FIX - pass the organisation-level MACHINE_TOKEN in the caller:"
            echo
            printf '    secrets:\n'
            printf '      github_pat: %s{ secrets.MACHINE_TOKEN }}\n' '${'
            echo
            echo "ALTERNATIVE - if this repository has no private Go dependencies,"
            echo "switch the feature off instead of passing a token:"
            echo
            printf '    with:\n'
            printf '      enable_private_repos: false\n'
            echo
            echo "=================================================================="
          } >&2
          exit 1

      - name: Configure access to private repos
        if: ${{ inputs.enable_private_repos }}
        run: |
          git config --global url."https://${{ secrets.github_pat }}@github.com/".insteadOf "https://github.com/"

      - name: Build Docker image
        env:
          DOCKER_BUILDKIT: 0
          GITHUB_TOKEN_SECRET: ${{ secrets.github_pat }}
        run: |
          BUILD_ARGS=""
          if [ -n "$GITHUB_TOKEN_SECRET" ]; then
            BUILD_ARGS="--build-arg GITHUB_TOKEN=$GITHUB_TOKEN_SECRET"
          fi

          docker build $BUILD_ARGS \
            -f ${{ inputs.dockerfile_path }} \
            -t ci-build-test:${{ github.sha }} \
            ${{ inputs.docker_context }}

  docker-lint:
    if: ${{ inputs.run_docker_lint }}
    uses: signapse/reusable-workflows/.github/workflows/docker-lint.yml@main
    with:
      dockerfile-path: ${{ inputs.dockerfile_path }}
