name: Go CI (Reusable)

on:
  workflow_call:
    inputs:
      go_version:
        description: 'Go version to use (leave empty to auto-detect from go.mod)'
        required: false
        type: string
        default: ''

      golangci_lint_version:
        description: 'golangci-lint version (must be a v2 release, or "latest")'
        required: false
        type: string
        # Pinned deliberately, not 'latest'. A linter release can turn CI red
        # across every open PR in every calling repo with no code change on
        # anyone's part, which has already happened twice. Bump this
        # consciously.
        default: 'v2.13.2'

      run_lint:
        description: 'Run lint and format check'
        required: false
        type: boolean
        default: true

      run_tests:
        description: 'Run tests with coverage'
        required: false
        type: boolean
        default: true

      run_security_scan:
        description: 'Run Trivy filesystem scan'
        required: false
        type: boolean
        default: true

      run_docker_build:
        description: 'Test Docker build (no push)'
        required: false
        type: boolean
        default: false

      run_docker_lint:
        description: 'Lint Dockerfile'
        required: false
        type: boolean
        default: false

      dockerfile_path:
        description: 'Path to Dockerfile'
        required: false
        type: string
        default: './Dockerfile'

      docker_context:
        description: 'Docker build context path'
        required: false
        type: string
        default: '.'

      enable_private_repos:
        description: 'Enable access to private signapse/* modules (GitHub App token, or github_pat fallback)'
        required: false
        type: boolean
        default: false

      goprivate:
        description: 'GOPRIVATE environment variable value'
        required: false
        type: string
        default: 'github.com/signapse/*'

    secrets:
      CI_GITHUB_APP_PRIVATE_KEY:
        description: 'Private key of the read-only CI GitHub App (SIG-2792). With the org variable CI_GITHUB_APP_ID it mints a per-run token for private signapse/* modules. Preferred over github_pat.'
        required: false
      github_pat:
        description: 'DEPRECATED fallback: GitHub PAT for private repositories, used only when the App credentials are absent. Remove once every caller passes CI_GITHUB_APP_PRIVATE_KEY.'
        required: false

permissions:
  contents: read

jobs:
  lint:
    if: ${{ inputs.run_lint }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go_version || null }}
          go-version-file: ${{ inputs.go_version == '' && 'go.mod' || '' }}
          cache: true

      # Private-module access. When the org variable CI_GITHUB_APP_ID and the
      # CI_GITHUB_APP_PRIVATE_KEY secret are both present, mint a read-only
      # GitHub App token (valid one hour, scoped to the repos the App is
      # installed on). Otherwise fall back to the github_pat secret so callers
      # that have not migrated yet keep working. The secret goes through env
      # because `if:` cannot read secrets.
      - name: Check for GitHub App credentials
        id: app
        if: ${{ inputs.enable_private_repos }}
        env:
          APP_ID: ${{ vars.CI_GITHUB_APP_ID }}
          APP_KEY: ${{ secrets.CI_GITHUB_APP_PRIVATE_KEY }}
        run: |
          if [ -n "$APP_ID" ] && [ -n "$(printf '%s' "$APP_KEY" | tr -d '[:space:]')" ]; then
            echo "use_app=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Mint read-only GitHub App token
        id: deps
        if: ${{ steps.app.outputs.use_app == 'true' }}
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349  # v2.2.2
        with:
          app-id: ${{ vars.CI_GITHUB_APP_ID }}
          private-key: ${{ secrets.CI_GITHUB_APP_PRIVATE_KEY }}
          owner: signapse
          permission-contents: read

      - name: Verify private-repo credentials are available
        if: ${{ inputs.enable_private_repos && steps.app.outputs.use_app != 'true' }}
        env:
          GITHUB_PAT: ${{ secrets.github_pat }}
        run: |
          # A whitespace-only secret is as unusable as an empty one and would
          # produce the same credential-less rewrite, so trim before testing.
          if [ -n "$(printf '%s' "$GITHUB_PAT" | tr -d '[:space:]')" ]; then
            echo "No GitHub App credentials; falling back to github_pat."
            exit 0
          fi

          echo "::error title=No private-module credentials::enable_private_repos is true but neither the GitHub App credentials nor github_pat reached go-ci.yml. See this step's log for the fix."

          {
            echo "=================================================================="
            echo "  go-ci.yml: no credentials for private Go modules"
            echo "=================================================================="
            echo
            echo "enable_private_repos is true, but the org variable CI_GITHUB_APP_ID"
            echo "and the secret CI_GITHUB_APP_PRIVATE_KEY were not both available,"
            echo "and the fallback secret 'github_pat' resolved to an EMPTY string."
            echo "Continuing would write a credential-less git URL rewrite and fail"
            echo "at the first private module fetch with this misleading error:"
            echo "    fatal: could not read Password for 'https://github.com': terminal prompts disabled"
            echo
            echo "FIX - pass the App private key in the caller (the org variable"
            echo "CI_GITHUB_APP_ID must also be visible to the calling repo):"
            echo
            printf '    secrets:\n'
            printf '      CI_GITHUB_APP_PRIVATE_KEY: %s{ secrets.CI_GITHUB_APP_PRIVATE_KEY }}\n' '${'
            echo
            echo "or use 'secrets: inherit'. A reference to a repository-level secret"
            echo "owned by another repository is not an error; it silently expands to"
            echo "an empty string."
            echo
            echo "ALTERNATIVE - if this repository has no private Go dependencies:"
            echo
            printf '    with:\n'
            printf '      enable_private_repos: false\n'
            echo
            echo "=================================================================="
          } >&2
          exit 1

      - name: Configure access to private repos
        if: ${{ inputs.enable_private_repos }}
        env:
          DEPS_TOKEN: ${{ steps.deps.outputs.token || secrets.github_pat }}
          USE_APP: ${{ steps.app.outputs.use_app }}
        run: |
          if [ "$USE_APP" = "true" ]; then
            # An installation token only reaches the repos the App is installed on,
            # all under signapse, so scope the rewrite to that owner.
            git config --global url."https://x-access-token:${DEPS_TOKEN}@github.com/signapse/".insteadOf "https://github.com/signapse/"
          else
            # PAT fallback: unchanged behaviour. A PAT can also read private modules
            # in other orgs listed in goprivate, so keep the github.com-wide rewrite.
            git config --global url."https://${DEPS_TOKEN}@github.com/".insteadOf "https://github.com/"
          fi

      # golangci-lint v2 lives on a /v2 module path, which `install-mode:
      # goinstall` cannot reach: it runs
      #     go install github.com/golangci/golangci-lint/cmd/golangci-lint@<version>
      # against the v1 path, so 'latest' resolved to v1.64.8. That breaks two
      # ways, both verified rather than assumed:
      #
      #   * Go >= 1.27 emits export data format version 4, and v1's bundled
      #     type-checker reads version 2 at most. It then cannot import even
      #     `unicode`, every package fails to typecheck, and the cascade
      #     surfaces as hundreds of bogus "undefined: X" errors with nothing
      #     wrong in the code. Go 1.25 and 1.26 are unaffected.
      #   * A repo with a `version: "2"` .golangci.yml is refused outright:
      #     "you are using a configuration file for golangci-lint v2 with
      #     golangci-lint v1".
      #
      # Action v8 downloads the released binary and resolves v2 correctly, so
      # install-mode is left at its default. Do not reintroduce goinstall here
      # without switching the module path to /v2 as well.
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8.0.0
        with:
          version: ${{ inputs.golangci_lint_version }}
          args: --timeout=5m
        env:
          GOPRIVATE: ${{ inputs.goprivate }}

      - name: Check formatting
        run: |
          unformatted=$(gofmt -s -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not formatted:"
            echo "$unformatted"
            exit 1
          fi

  test:
    if: ${{ inputs.run_tests }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go_version || null }}
          go-version-file: ${{ inputs.go_version == '' && 'go.mod' || '' }}
          cache: true

      # Private-module access. When the org variable CI_GITHUB_APP_ID and the
      # CI_GITHUB_APP_PRIVATE_KEY secret are both present, mint a read-only
      # GitHub App token (valid one hour, scoped to the repos the App is
      # installed on). Otherwise fall back to the github_pat secret so callers
      # that have not migrated yet keep working. The secret goes through env
      # because `if:` cannot read secrets.
      - name: Check for GitHub App credentials
        id: app
        if: ${{ inputs.enable_private_repos }}
        env:
          APP_ID: ${{ vars.CI_GITHUB_APP_ID }}
          APP_KEY: ${{ secrets.CI_GITHUB_APP_PRIVATE_KEY }}
        run: |
          if [ -n "$APP_ID" ] && [ -n "$(printf '%s' "$APP_KEY" | tr -d '[:space:]')" ]; then
            echo "use_app=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Mint read-only GitHub App token
        id: deps
        if: ${{ steps.app.outputs.use_app == 'true' }}
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349  # v2.2.2
        with:
          app-id: ${{ vars.CI_GITHUB_APP_ID }}
          private-key: ${{ secrets.CI_GITHUB_APP_PRIVATE_KEY }}
          owner: signapse
          permission-contents: read

      - name: Verify private-repo credentials are available
        if: ${{ inputs.enable_private_repos && steps.app.outputs.use_app != 'true' }}
        env:
          GITHUB_PAT: ${{ secrets.github_pat }}
        run: |
          # A whitespace-only secret is as unusable as an empty one and would
          # produce the same credential-less rewrite, so trim before testing.
          if [ -n "$(printf '%s' "$GITHUB_PAT" | tr -d '[:space:]')" ]; then
            echo "No GitHub App credentials; falling back to github_pat."
            exit 0
          fi

          echo "::error title=No private-module credentials::enable_private_repos is true but neither the GitHub App credentials nor github_pat reached go-ci.yml. See this step's log for the fix."

          {
            echo "=================================================================="
            echo "  go-ci.yml: no credentials for private Go modules"
            echo "=================================================================="
            echo
            echo "enable_private_repos is true, but the org variable CI_GITHUB_APP_ID"
            echo "and the secret CI_GITHUB_APP_PRIVATE_KEY were not both available,"
            echo "and the fallback secret 'github_pat' resolved to an EMPTY string."
            echo "Continuing would write a credential-less git URL rewrite and fail"
            echo "at the first private module fetch with this misleading error:"
            echo "    fatal: could not read Password for 'https://github.com': terminal prompts disabled"
            echo
            echo "FIX - pass the App private key in the caller (the org variable"
            echo "CI_GITHUB_APP_ID must also be visible to the calling repo):"
            echo
            printf '    secrets:\n'
            printf '      CI_GITHUB_APP_PRIVATE_KEY: %s{ secrets.CI_GITHUB_APP_PRIVATE_KEY }}\n' '${'
            echo
            echo "or use 'secrets: inherit'. A reference to a repository-level secret"
            echo "owned by another repository is not an error; it silently expands to"
            echo "an empty string."
            echo
            echo "ALTERNATIVE - if this repository has no private Go dependencies:"
            echo
            printf '    with:\n'
            printf '      enable_private_repos: false\n'
            echo
            echo "=================================================================="
          } >&2
          exit 1

      - name: Configure access to private repos
        if: ${{ inputs.enable_private_repos }}
        env:
          DEPS_TOKEN: ${{ steps.deps.outputs.token || secrets.github_pat }}
          USE_APP: ${{ steps.app.outputs.use_app }}
        run: |
          if [ "$USE_APP" = "true" ]; then
            # An installation token only reaches the repos the App is installed on,
            # all under signapse, so scope the rewrite to that owner.
            git config --global url."https://x-access-token:${DEPS_TOKEN}@github.com/signapse/".insteadOf "https://github.com/signapse/"
          else
            # PAT fallback: unchanged behaviour. A PAT can also read private modules
            # in other orgs listed in goprivate, so keep the github.com-wide rewrite.
            git config --global url."https://${DEPS_TOKEN}@github.com/".insteadOf "https://github.com/"
          fi

      - name: Download dependencies
        run: |
          go mod download
          go mod verify
        env:
          GOPRIVATE: ${{ inputs.goprivate }}

      - name: Run tests
        run: go test ./... -v -race -coverprofile=coverage.out
        env:
          GOPRIVATE: ${{ inputs.goprivate }}

      - name: Generate coverage report
        run: go tool cover -html=coverage.out -o coverage.html

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.html
          retention-days: 14

  security-scan:
    if: ${{ inputs.run_security_scan }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create shared Trivy ignore file
        run: |
          # Append centrally-managed CVE exceptions so every caller inherits them.
          # Review periodically and remove entries once upstream fixes land.
          cat >> .trivyignore <<'EOF'
          # github.com/docker/docker (indirect, test-only)
          # CVE-2026-34040 - Moby authorization bypass. No upstream fix yet.
          CVE-2026-34040
          EOF

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          format: 'table'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          trivyignores: '.trivyignore'

  docker-build:
    if: ${{ inputs.run_docker_build }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Private-module access. When the org variable CI_GITHUB_APP_ID and the
      # CI_GITHUB_APP_PRIVATE_KEY secret are both present, mint a read-only
      # GitHub App token (valid one hour, scoped to the repos the App is
      # installed on). Otherwise fall back to the github_pat secret so callers
      # that have not migrated yet keep working. The secret goes through env
      # because `if:` cannot read secrets.
      - name: Check for GitHub App credentials
        id: app
        if: ${{ inputs.enable_private_repos }}
        env:
          APP_ID: ${{ vars.CI_GITHUB_APP_ID }}
          APP_KEY: ${{ secrets.CI_GITHUB_APP_PRIVATE_KEY }}
        run: |
          if [ -n "$APP_ID" ] && [ -n "$(printf '%s' "$APP_KEY" | tr -d '[:space:]')" ]; then
            echo "use_app=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Mint read-only GitHub App token
        id: deps
        if: ${{ steps.app.outputs.use_app == 'true' }}
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349  # v2.2.2
        with:
          app-id: ${{ vars.CI_GITHUB_APP_ID }}
          private-key: ${{ secrets.CI_GITHUB_APP_PRIVATE_KEY }}
          owner: signapse
          permission-contents: read

      - name: Verify private-repo credentials are available
        if: ${{ inputs.enable_private_repos && steps.app.outputs.use_app != 'true' }}
        env:
          GITHUB_PAT: ${{ secrets.github_pat }}
        run: |
          # A whitespace-only secret is as unusable as an empty one and would
          # produce the same credential-less rewrite, so trim before testing.
          if [ -n "$(printf '%s' "$GITHUB_PAT" | tr -d '[:space:]')" ]; then
            echo "No GitHub App credentials; falling back to github_pat."
            exit 0
          fi

          echo "::error title=No private-module credentials::enable_private_repos is true but neither the GitHub App credentials nor github_pat reached go-ci.yml. See this step's log for the fix."

          {
            echo "=================================================================="
            echo "  go-ci.yml: no credentials for private Go modules"
            echo "=================================================================="
            echo
            echo "enable_private_repos is true, but the org variable CI_GITHUB_APP_ID"
            echo "and the secret CI_GITHUB_APP_PRIVATE_KEY were not both available,"
            echo "and the fallback secret 'github_pat' resolved to an EMPTY string."
            echo "Continuing would write a credential-less git URL rewrite and fail"
            echo "at the first private module fetch with this misleading error:"
            echo "    fatal: could not read Password for 'https://github.com': terminal prompts disabled"
            echo
            echo "FIX - pass the App private key in the caller (the org variable"
            echo "CI_GITHUB_APP_ID must also be visible to the calling repo):"
            echo
            printf '    secrets:\n'
            printf '      CI_GITHUB_APP_PRIVATE_KEY: %s{ secrets.CI_GITHUB_APP_PRIVATE_KEY }}\n' '${'
            echo
            echo "or use 'secrets: inherit'. A reference to a repository-level secret"
            echo "owned by another repository is not an error; it silently expands to"
            echo "an empty string."
            echo
            echo "ALTERNATIVE - if this repository has no private Go dependencies:"
            echo
            printf '    with:\n'
            printf '      enable_private_repos: false\n'
            echo
            echo "=================================================================="
          } >&2
          exit 1

      - name: Build Docker image
        env:
          DOCKER_BUILDKIT: 1
          DOCKERFILE_PATH: ${{ inputs.dockerfile_path }}
          DOCKER_CONTEXT: ${{ inputs.docker_context }}
          # App token when minted, else the legacy PAT.
          DEPS_TOKEN: ${{ steps.deps.outputs.token || secrets.github_pat }}
          USE_APP: ${{ steps.app.outputs.use_app }}
        run: |
          # The token is a BuildKit secret (RUN --mount=type=secret,id=gh_token),
          # never a build-arg, so it cannot land in a layer or `docker history`.
          # github_token is the same value under the id older Dockerfiles use.
          SECRET_ARGS=()
          if [ -n "$DEPS_TOKEN" ]; then
            SECRET_ARGS+=(--secret "id=gh_token,env=DEPS_TOKEN" --secret "id=github_token,env=DEPS_TOKEN")
          fi

          # Callers not yet migrated to the App token still have Dockerfiles that
          # read ARG GITHUB_TOKEN; keep that working on the PAT fallback only.
          BUILD_ARGS=()
          if [ "$USE_APP" != "true" ] && [ -n "$DEPS_TOKEN" ]; then
            BUILD_ARGS+=(--build-arg "GITHUB_TOKEN=$DEPS_TOKEN")
          fi

          docker build "${BUILD_ARGS[@]}" "${SECRET_ARGS[@]}" \
            -f "${DOCKERFILE_PATH}" \
            -t "ci-build-test:${GITHUB_SHA}" \
            "${DOCKER_CONTEXT}"

  docker-lint:
    if: ${{ inputs.run_docker_lint }}
    uses: signapse/reusable-workflows/.github/workflows/docker-lint.yml@main
    with:
      dockerfile-path: ${{ inputs.dockerfile_path }}
