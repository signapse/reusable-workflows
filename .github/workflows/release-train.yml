name: Release Train (reusable)

# Two modes, chosen by `selection_mode`:
#
#   qa-passed (ADR 0001, the Autonomous Delivery Pipeline): the `select` job
#     picks the Release Candidate, the newest main build whose tickets all
#     carry QA Passed, walking from the release tag prod runs, and outputs it
#     (rc_sha, rc_image_tag, rc_tickets, untracked_commits, blocked_by).
#     Callers trigger it from the event router
#     (workflow_dispatch with `ticket` + `trigger_id`) plus an hourly schedule.
#     The `promote` job then promotes it to staging (SIG-2764): inside the
#     deploy window (or with a hotfix ticket) it re-tags the dev image with the
#     next release version in ECR and git (no rebuild), waits for Flux to run
#     it on staging, and moves the tickets to On Staging. Outside the window it
#     reports `deferred` and does nothing; the next hourly run promotes.
#     Caller template: docs/RELEASE-TRAIN.md.
#
#   ready-for-prod (default, legacy until SIG-2773): composes TrainState from
#     the tag..HEAD range, opens a draft release when no ticket is outside
#     "Ready for Prod", and posts the Slack alert carrying the "Cut release
#     tag" button. On `release: published` it instead posts the prod-promotion
#     prompt as a thread reply under that same alert.
#
# The caller owns `on:` and `permissions:` — a reusable workflow can only
# downgrade the permissions it is handed, never elevate them. Legacy callers
# grant contents: write, pull-requests: read, checks: read; qa-passed callers
# also grant actions: read (the build lookup reads main-push runs) and
# id-token: write (the promote job assumes the ECR role); prod's tag and the
# Flux commits are read with the read-only pipeline app (read_app_id).

on:
  workflow_call:
    inputs:
      selection_mode:
        description: >-
          qa-passed: select the newest all-QA-Passed build (ADR 0001).
          ready-for-prod: legacy "Ready for Prod" train with the Slack cut
          button; retired by SIG-2773 once the pilot cuts over.
        required: false
        type: string
        default: 'ready-for-prod'
      ticket:
        description: >-
          qa-passed: ticket whose QA Passed label triggered the run (e.g.
          SIG-123), from the event router. Shown in the summary only; the
          selection never depends on it, so the hourly run picks the same build.
        required: false
        type: string
        default: ''
      trigger_id:
        description: 'qa-passed: Linear webhook delivery id from the event router. Shown in the summary.'
        required: false
        type: string
        default: ''
      qa_passed_label:
        description: 'qa-passed: Linear label that marks a ticket approved on dev.'
        required: false
        type: string
        default: 'QA Passed'
      qa_failed_state:
        description: 'qa-passed: Linear column that stops the line.'
        required: false
        type: string
        default: 'QA Failed'
      build_workflow:
        description: >-
          qa-passed: file name of the caller's build workflow. A successful run
          of it on `release_branch` makes a commit a build, tagged
          main-<run_number>-<sha>.
        required: false
        type: string
        default: 'main-push.yml'
      release_branch:
        description: 'qa-passed: branch whose builds are promoted.'
        required: false
        type: string
        default: 'main'
      release_tag_pattern:
        description: 'qa-passed: ERE matching release tags (bare or v-prefixed semver by default).'
        required: false
        type: string
        default: '^v?[0-9]+\.[0-9]+\.[0-9]+$'
      prod_services:
        description: >-
          qa-passed: JSON array of the signapse-core-k8s deploy-prod.yml
          services this repo runs as in prod (e.g. ["signstream-api"]). The
          walk starts at the release tag prod runs (selection-base.sh), so
          every commit not in prod yet is checked on every run. Required
          unless selection_base is set.
        required: false
        type: string
        default: ''
      selection_base:
        description: >-
          qa-passed: explicit walk base (tag or sha), instead of reading prod.
          Only for the first Deployment through the train, when prod runs a
          tag this repo does not have.
        required: false
        type: string
        default: ''
      read_app_id:
        description: 'qa-passed: GitHub App id of the read-only pipeline app (ADR 0005); reads gitops_repo.'
        required: false
        type: string
        default: ''
      services:
        description: >-
          qa-passed: JSON array of the ECR repositories main-push builds for
          this repo (e.g. ["http","websocket"]), joined to ecr_repo_prefix.
          Every one is re-tagged on Promotion.
        required: false
        type: string
        default: '[]'
      ecr_repo_prefix:
        description: 'qa-passed: ECR repo prefix, no slashes (e.g. "signstream"). Empty for none.'
        required: false
        type: string
        default: ''
      aws_region:
        description: 'qa-passed: region of the ECR registry.'
        required: false
        type: string
        default: 'eu-west-2'
      iam_role_arn:
        description: 'qa-passed: role with ecr:BatchGetImage, DescribeImages and PutImage on `services`.'
        required: false
        type: string
        default: ''
      staging_watch_paths:
        description: >-
          qa-passed: newline- or comma-separated files in gitops_repo that Flux
          image automation rewrites with this repo's staging tags, one per
          service (e.g. workloads/stg/signstream-api/helmrelease-patch.yaml).
        required: false
        type: string
        default: ''
      staging_version_url:
        description: >-
          qa-passed, required for a Promotion: URL whose JSON body names the
          version staging runs. The Promotion waits until it reports the
          release tag (or newer); there is no fixed-sleep fallback.
        required: false
        type: string
        default: ''
      staging_version_jq:
        description: 'qa-passed: jq path to the version in staging_version_url''s body.'
        required: false
        type: string
        default: '.version'
      staging_deploy_timeout_minutes:
        description: 'qa-passed: limit on waiting for staging to run the new tag.'
        required: false
        type: number
        default: 20
      gitops_repo:
        description: 'qa-passed: repo holding the prod (and Flux) image tags.'
        required: false
        type: string
        default: 'signapse/signapse-core-k8s'
      gitops_ref:
        required: false
        type: string
        default: 'main'
      on_staging_state:
        description: 'qa-passed: Linear column for tickets running on staging.'
        required: false
        type: string
        default: 'On Staging'
      on_staging_from:
        description: >-
          qa-passed: comma-separated columns a ticket may move to
          on_staging_state from. A ticket anywhere else (already On Prod,
          Rolling Out, Done or QA Failed) is not moved back.
        required: false
        type: string
        default: 'On Dev · Ready for QA,Ready for QA,QA in Progress,Ready for Prod'
      staging_passed_label:
        description: 'qa-passed: label cleared from the tickets at each Promotion (set again by the staging tests).'
        required: false
        type: string
        default: 'Staging Passed'
      staging_failed_label:
        description: 'qa-passed: label cleared from the tickets at each Promotion.'
        required: false
        type: string
        default: 'Staging Failed'
      hotfix_label:
        description: 'qa-passed: Linear label that lets a Promotion run outside the deploy window.'
        required: false
        type: string
        default: 'hotfix'
      deploy_window_now:
        description: >-
          qa-passed, TESTING ONLY: pretend the time is this (UTC
          YYYY-MM-DDTHH:MM:SSZ or epoch seconds) for the deploy window check.
          Leave empty in real callers.
        required: false
        type: string
        default: ''
      linear_team_key:
        description: 'Linear team key, alphanumeric (e.g. SIG)'
        required: false
        type: string
        default: 'SIG'
      sentry_org:
        required: false
        type: string
        default: 'signapse'
      sentry_project:
        description: 'Sentry project slug. Empty skips the Sentry health check.'
        required: false
        type: string
        default: ''
      staging_check_pattern:
        description: >-
          jq test() regex over check-run names for the staging health gate.
          Empty disables the gate.
        required: false
        type: string
        default: 'staging|smoke'
      serialization_detector_paths:
        description: 'RESERVED — not consumed yet. See actions/release-train.'
        required: false
        type: string
        default: '[]'
      slack_releases_channel:
        description: 'Overrides the SLACK_RELEASES_CHANNEL org var.'
        required: false
        type: string
        default: ''
      slack_release_clickers_group_id:
        description: 'Overrides the SLACK_RELEASE_CLICKERS_GROUP_ID org var.'
        required: false
        type: string
        default: ''
      deploy_to_prod_url:
        description: 'Deploy-to-Prod workflow link used in the post-publish prompt.'
        required: false
        type: string
        default: 'https://github.com/signapse/signapse-core-k8s/actions/workflows/deploy-to-prod.yml'
    secrets:
      LINEAR_API_KEY:
        required: true
      SENTRY_AUTH_TOKEN:
        required: false
      SLACK_BOT_TOKEN:
        # Only the ready-for-prod mode posts to Slack.
        required: false
      READ_APP_PRIVATE_KEY:
        # qa-passed: private key of the read_app_id app.
        required: false
    outputs:
      state:
        description: 'TrainState JSON'
        value: ${{ jobs.compose.outputs.state }}
      next_version:
        description: 'Proposed semver'
        value: ${{ jobs.compose.outputs.next_version }}
      variant:
        description: 'ready | held'
        value: ${{ jobs.compose.outputs.variant }}
      draft_url:
        description: 'Draft release URL (ready variant only)'
        value: ${{ jobs.compose.outputs.draft_url }}
      alert_ts:
        description: 'Slack ts of the posted alert'
        value: ${{ jobs.compose.outputs.alert_ts }}
      outcome:
        description: 'qa-passed: selected | already_promoted | none'
        value: ${{ jobs.select.outputs.outcome }}
      rc_sha:
        description: 'qa-passed: commit of the Release Candidate (empty when none)'
        value: ${{ jobs.select.outputs.rc_sha }}
      rc_image_tag:
        description: 'qa-passed: image tag of the Release Candidate, main-<run_number>-<sha>'
        value: ${{ jobs.select.outputs.rc_image_tag }}
      rc_tickets:
        description: 'qa-passed: comma-separated tickets in the Release Candidate (SIG-1,SIG-2)'
        value: ${{ jobs.select.outputs.rc_tickets }}
      untracked_commits:
        description: 'qa-passed: JSON array [{sha, subject}] of ticketless commits riding along'
        value: ${{ jobs.select.outputs.untracked_commits }}
      blocked_by:
        description: 'qa-passed: ticket that stopped the line (empty when none)'
        value: ${{ jobs.select.outputs.blocked_by }}
      selection_base:
        description: 'qa-passed: where the walk started: the release tag prod runs (or selection_base)'
        value: ${{ jobs.select.outputs.selection_base }}
      selection:
        description: 'qa-passed: full selection JSON (see actions/release-train/scripts/release-candidate.sh)'
        value: ${{ jobs.select.outputs.selection }}
      promoted:
        description: >-
          qa-passed: 'true' once the Release Candidate is tagged, staging runs
          it and its tickets are On Staging; 'false' otherwise (empty when
          the promote job did not run: outcome none or already_promoted).
        value: ${{ jobs.promote.outputs.promoted }}
      deferred:
        description: "qa-passed: 'true' when the Promotion waited for the deploy window (nothing was done)."
        value: ${{ jobs.promote.outputs.deferred }}
      version:
        description: 'qa-passed: semver of the Promotion, no prefix (e.g. 1.2.45). Empty unless tagged.'
        value: ${{ jobs.promote.outputs.version }}
      release_tag:
        description: 'qa-passed: the tag created in git and ECR (the version, with a v only if the repo uses one).'
        value: ${{ jobs.promote.outputs.release_tag }}
      image_digest:
        description: 'qa-passed: JSON object, ECR repository -> digest the release tag names (same as the dev build).'
        value: ${{ jobs.promote.outputs.image_digest }}
      promotion_decision:
        description: 'qa-passed: open | hotfix | deferred | resume (see promotion-plan.sh)'
        value: ${{ jobs.promote.outputs.decision }}

# No workflow-level `permissions:` on purpose: each job declares its own. The
# select job declares none and inherits the caller's grant, because asking for
# actions: read here would fail every legacy caller that does not grant it.

jobs:
  # A typo in selection_mode would otherwise skip every job and pass green.
  check-mode:
    if: inputs.selection_mode != 'qa-passed' && inputs.selection_mode != 'ready-for-prod'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Reject unknown selection_mode
        env:
          MODE: ${{ inputs.selection_mode }}
        run: |
          echo "::error::selection_mode must be qa-passed or ready-for-prod (got '$MODE')"
          exit 1

  select:
    if: inputs.selection_mode == 'qa-passed' && github.event_name != 'release'
    runs-on: ubuntu-latest
    outputs:
      outcome: ${{ steps.select.outputs.outcome }}
      rc_sha: ${{ steps.select.outputs.rc_sha }}
      rc_image_tag: ${{ steps.select.outputs.rc_image_tag }}
      rc_tickets: ${{ steps.select.outputs.rc_tickets }}
      untracked_commits: ${{ steps.select.outputs.untracked_commits }}
      blocked_by: ${{ steps.select.outputs.blocked_by }}
      selection: ${{ steps.select.outputs.selection }}
      selection_base: ${{ steps.base.outputs.base }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_branch }}
          fetch-depth: 0          # the walk needs history and tags since the tag prod runs
          persist-credentials: false

      # Same pattern as post-publish: the scripts are fetched explicitly so the
      # ref is visible; Phase 1 flips it to v1 alongside the callers.
      - name: Fetch release-train scripts
        uses: actions/checkout@v4
        with:
          repository: signapse/reusable-workflows
          # Scripts from the same commit as this workflow, not mutable main. An
          # empty workflow_sha would silently check out main, so fail instead.
          ref: ${{ job.workflow_sha || 'job.workflow_sha-is-empty' }}
          path: _rw
          persist-credentials: false

      - name: Split GitOps repo
        id: gitops
        if: inputs.selection_base == ''
        env:
          GITOPS_REPO: ${{ inputs.gitops_repo }}
          READ_APP_ID: ${{ inputs.read_app_id }}
          PROD_SERVICES: ${{ inputs.prod_services }}
        run: |
          set -euo pipefail
          missing=()
          jq -e 'type == "array" and length > 0' <<< "$PROD_SERVICES" > /dev/null 2>&1 || missing+=(prod_services)
          [ -n "$READ_APP_ID" ] || missing+=(read_app_id)
          [[ "$GITOPS_REPO" == */* ]] || missing+=("gitops_repo as owner/name")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::qa-passed selection starts at the tag prod runs and needs: ${missing[*]} (or selection_base). See docs/RELEASE-TRAIN.md"
            exit 1
          fi
          echo "owner=${GITOPS_REPO%%/*}" >> "$GITHUB_OUTPUT"
          echo "name=${GITOPS_REPO#*/}" >> "$GITHUB_OUTPUT"

      - name: Mint read-only app token
        id: app
        if: inputs.selection_base == ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ inputs.read_app_id }}
          private-key: ${{ secrets.READ_APP_PRIVATE_KEY }}
          owner: ${{ steps.gitops.outputs.owner }}
          repositories: ${{ steps.gitops.outputs.name }}
          permission-contents: read

      # Walk base: the release tag prod runs (ADR 0001). Everything after it
      # is checked again on every run, so a tag that failed staging or was
      # rolled back keeps stopping the line.
      - name: Find where prod is
        id: base
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SELECTION_BASE: ${{ inputs.selection_base }}
          PROD_SERVICES: ${{ inputs.prod_services }}
          GITOPS_REPO: ${{ inputs.gitops_repo }}
          GITOPS_REF: ${{ inputs.gitops_ref }}
          RELEASE_TAG_PATTERN: ${{ inputs.release_tag_pattern }}
        run: |
          set -euo pipefail
          b=$("$GITHUB_WORKSPACE/_rw/actions/release-train/scripts/selection-base.sh")
          echo "base=$(jq -r .base <<< "$b")" >> "$GITHUB_OUTPUT"

      - name: Select Release Candidate
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          LINEAR_TEAM_KEY: ${{ inputs.linear_team_key }}
          QA_PASSED_LABEL: ${{ inputs.qa_passed_label }}
          QA_FAILED_STATE: ${{ inputs.qa_failed_state }}
          BUILD_WORKFLOW: ${{ inputs.build_workflow }}
          BRANCH: ${{ inputs.release_branch }}
          RELEASE_TAG_PATTERN: ${{ inputs.release_tag_pattern }}
          TICKET: ${{ inputs.ticket }}
          TRIGGER_ID: ${{ inputs.trigger_id }}
          BASE: ${{ steps.base.outputs.base }}
        run: |
          set -euo pipefail
          sel=$("$GITHUB_WORKSPACE/_rw/actions/release-train/scripts/release-candidate.sh" "$BASE" HEAD)
          eof="EOF_$(openssl rand -hex 8)"
          {
            echo "outcome=$(jq -r .outcome <<< "$sel")"
            echo "rc_sha=$(jq -r '.rc.sha // ""' <<< "$sel")"
            echo "rc_image_tag=$(jq -r '.rc.image_tag // ""' <<< "$sel")"
            echo "rc_tickets=$(jq -r '[.tickets[].id] | join(",")' <<< "$sel")"
            echo "untracked_commits=$(jq -c .untracked_commits <<< "$sel")"
            echo "blocked_by=$(jq -r '.blocked_by.id // ""' <<< "$sel")"
            echo "selection<<$eof"
            echo "$sel"
            echo "$eof"
          } >> "$GITHUB_OUTPUT"

          "$GITHUB_WORKSPACE/_rw/actions/release-train/scripts/release-candidate-summary.sh" \
            <<< "$sel" >> "$GITHUB_STEP_SUMMARY"

  # Staging Promotion (SIG-2764). Runs only for a freshly selected Release
  # Candidate: `already_promoted` and `none` do nothing.
  promote:
    needs: select
    if: needs.select.outputs.outcome == 'selected'
    runs-on: ubuntu-latest
    # Backstop only; staging-deploy-wait.sh enforces staging_deploy_timeout_minutes.
    timeout-minutes: 90
    # One Promotion per repo at a time, never cancelled midway (spec
    # "Guardrails", AC5). The name must differ from the caller's workflow-level
    # group (release-train-<repo> in the template), or this job would queue
    # behind its own run forever. See docs/RELEASE-TRAIN.md "Concurrency".
    concurrency:
      group: promotion-${{ github.repository }}
      cancel-in-progress: false
    # No `permissions:` on purpose, like select: requesting id-token here would
    # fail legacy callers at startup. The caller grants contents: write (git
    # tag) and id-token: write (ECR role).
    outputs:
      decision: ${{ steps.plan.outputs.decision }}
      deferred: ${{ steps.plan.outputs.deferred }}
      version: ${{ steps.tag.outputs.version }}
      release_tag: ${{ steps.tag.outputs.release_tag }}
      image_digest: ${{ steps.tag.outputs.image_digest }}
      promoted: ${{ steps.done.outputs.promoted || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_branch }}
          fetch-depth: 0          # every release tag, for the next version
          persist-credentials: false

      - name: Fetch release-train scripts
        uses: actions/checkout@v4
        with:
          repository: signapse/reusable-workflows
          ref: main
          path: _rw
          persist-credentials: false

      - name: Check Promotion inputs
        env:
          SERVICES: ${{ inputs.services }}
          IAM_ROLE_ARN: ${{ inputs.iam_role_arn }}
          WATCH_PATHS: ${{ inputs.staging_watch_paths }}
          VERSION_URL: ${{ inputs.staging_version_url }}
          READ_APP_ID: ${{ inputs.read_app_id }}
        run: |
          set -euo pipefail
          missing=()
          jq -e 'type == "array" and length > 0' <<< "$SERVICES" > /dev/null 2>&1 || missing+=(services)
          [ -n "$IAM_ROLE_ARN" ] || missing+=(iam_role_arn)
          [ -n "$WATCH_PATHS" ] || missing+=(staging_watch_paths)
          [ -n "$VERSION_URL" ] || missing+=(staging_version_url)
          [ -n "$READ_APP_ID" ] || missing+=(read_app_id)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::qa-passed Promotion needs these inputs: ${missing[*]} (see docs/RELEASE-TRAIN.md)"
            exit 1
          fi

      # Read-only: deploy window and version. A deferred run stops here.
      - name: Plan Promotion
        id: plan
        env:
          RC_SHA: ${{ needs.select.outputs.rc_sha }}
          RC_TICKETS: ${{ needs.select.outputs.rc_tickets }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          HOTFIX_LABEL: ${{ inputs.hotfix_label }}
          RELEASE_TAG_PATTERN: ${{ inputs.release_tag_pattern }}
          NOW: ${{ inputs.deploy_window_now }}
        run: |
          set -euo pipefail
          plan=$("$GITHUB_WORKSPACE/_rw/actions/release-train/scripts/promotion-plan.sh" "$RC_SHA" "$RC_TICKETS")
          decision=$(jq -r .decision <<< "$plan")
          {
            echo "decision=$decision"
            echo "deferred=$([ "$decision" = deferred ] && echo true || echo false)"
            echo "tag=$(jq -r .tag <<< "$plan")"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Promotion to staging"
            echo
            case "$decision" in
              deferred)
                echo "**Deferred: outside the deploy window** ($(jq -r .local_time <<< "$plan"))."
                echo "Nothing was tagged, deployed or moved. The train's hourly run promotes"
                echo "the Release Candidate it selects then, from $(jq -r .next_open <<< "$plan")." ;;
              hotfix) echo "Outside the deploy window ($(jq -r .local_time <<< "$plan")), going ahead: a ticket carries \`${HOTFIX_LABEL}\`." ;;
              resume) echo "The Release Candidate already carries \`$(jq -r .tag <<< "$plan")\`: finishing an earlier attempt." ;;
              *) echo "Inside the deploy window ($(jq -r .local_time <<< "$plan"))." ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"

      # SIG-2765 adds the staging Terraform gate here, before anything is tagged.

      - uses: aws-actions/configure-aws-credentials@v6
        if: steps.plan.outputs.deferred == 'false'
        with:
          role-to-assume: ${{ inputs.iam_role_arn }}
          aws-region: ${{ inputs.aws_region }}

      # A staging verdict belongs to one tag. Clear the tickets' Staging
      # Passed / Staging Failed before the new tag exists, so an earlier
      # tag's pass can never vouch for this one if its staging tests never
      # finish (prod resume checks these labels). Before the tag: a failure
      # here leaves nothing promoted.
      - name: Clear earlier staging verdicts
        if: steps.plan.outputs.deferred == 'false'
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          RC_TICKETS: ${{ needs.select.outputs.rc_tickets }}
          LABELS: ${{ inputs.staging_passed_label }},${{ inputs.staging_failed_label }}
        run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE/_rw/actions/release-train/scripts/ticket-labels-remove.sh" "$LABELS" "$RC_TICKETS"

      - name: Tag the Release Candidate (ECR re-put, then git)
        id: tag
        if: steps.plan.outputs.deferred == 'false'
        env:
          RC_SHA: ${{ needs.select.outputs.rc_sha }}
          RC_IMAGE_TAG: ${{ needs.select.outputs.rc_image_tag }}
          TAG: ${{ steps.plan.outputs.tag }}
          SERVICES: ${{ inputs.services }}
          ECR_REPO_PREFIX: ${{ inputs.ecr_repo_prefix }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          res=$("$GITHUB_WORKSPACE/_rw/actions/release-train/scripts/promotion-tag.sh" "$RC_SHA" "$RC_IMAGE_TAG" "$TAG")
          {
            echo "release_tag=$TAG"
            echo "version=${TAG#v}"
            echo "image_digest=$(jq -c .digests <<< "$res")"
          } >> "$GITHUB_OUTPUT"
          {
            echo
            echo "\`${RC_IMAGE_TAG}\` re-tagged as \`${TAG}\` (no rebuild); git \`${TAG}\` -> \`${RC_SHA:0:12}\`."
            echo
            echo "| ECR repository | \`${RC_IMAGE_TAG:0:20}…\` digest | \`${TAG}\` digest |"
            echo "|---|---|---|"
            jq -r '.images[] | "| `\(.repository)` | `\(.source_digest)` | `\(.tag_digest)` |"' <<< "$res"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Split GitOps repo
        id: gitops
        if: steps.plan.outputs.deferred == 'false'
        env:
          GITOPS_REPO: ${{ inputs.gitops_repo }}
        run: |
          set -euo pipefail
          echo "owner=${GITOPS_REPO%%/*}" >> "$GITHUB_OUTPUT"
          echo "name=${GITOPS_REPO#*/}" >> "$GITHUB_OUTPUT"

      - name: Mint read-only app token
        id: app
        if: steps.plan.outputs.deferred == 'false'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ inputs.read_app_id }}
          private-key: ${{ secrets.READ_APP_PRIVATE_KEY }}
          owner: ${{ steps.gitops.outputs.owner }}
          repositories: ${{ steps.gitops.outputs.name }}
          permission-contents: read

      - name: Wait for staging to run ${{ steps.plan.outputs.tag }}
        if: steps.plan.outputs.deferred == 'false'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GITOPS_REPO: ${{ inputs.gitops_repo }}
          GITOPS_REF: ${{ inputs.gitops_ref }}
          WATCH_PATHS: ${{ inputs.staging_watch_paths }}
          TAG: ${{ steps.plan.outputs.tag }}
          VERSION_URL: ${{ inputs.staging_version_url }}
          VERSION_JQ: ${{ inputs.staging_version_jq }}
          TIMEOUT_MINUTES: ${{ inputs.staging_deploy_timeout_minutes }}
        run: |
          set -euo pipefail
          export TIMEOUT_SECONDS=$((TIMEOUT_MINUTES * 60))
          "$GITHUB_WORKSPACE/_rw/actions/release-train/scripts/staging-deploy-wait.sh"

      - name: Move tickets to ${{ inputs.on_staging_state }}
        if: steps.plan.outputs.deferred == 'false'
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          STATE: ${{ inputs.on_staging_state }}
          RC_TICKETS: ${{ needs.select.outputs.rc_tickets }}
          ALLOWED_FROM: ${{ inputs.on_staging_from }}
          LINEAR_TEAM_KEY: ${{ inputs.linear_team_key }}
          QA_FAILED_STATE: ${{ inputs.qa_failed_state }}
        run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE/_rw/actions/release-train/scripts/promotion-tickets.sh" "$STATE" "$RC_TICKETS"
          echo "Moved to **${STATE}**: ${RC_TICKETS:-no tickets (untracked commits only)}" >> "$GITHUB_STEP_SUMMARY"

      - name: Promoted
        id: done
        if: steps.plan.outputs.deferred == 'false'
        run: echo "promoted=true" >> "$GITHUB_OUTPUT"

  compose:
    if: inputs.selection_mode == 'ready-for-prod' && github.event_name != 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write        # gh release create/edit (release-metadata coord persistence)
      pull-requests: read    # train-composer's PR lookups
      checks: read           # staging gate
    outputs:
      state: ${{ steps.compose.outputs.state }}
      next_version: ${{ steps.compose.outputs.next_version }}
      draft_url: ${{ steps.draft.outputs.draft_url }}
      variant: ${{ steps.compose.outputs.variant }}
      alert_ts: ${{ steps.post.outputs.alert_ts }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # train-composer walks the tag..HEAD range
          persist-credentials: false

      - name: Install jq
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y jq

      - name: Diff against last tag
        id: diff
        run: |
          set -euo pipefail
          last_tag=$(git describe --tags --abbrev=0)
          echo "last_tag=$last_tag" >> "$GITHUB_OUTPUT"
          if git diff --quiet "$last_tag"..HEAD; then
            echo "empty=true" >> "$GITHUB_OUTPUT"
          else
            echo "empty=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Silent exit if no commits
        if: steps.diff.outputs.empty == 'true'
        env:
          LAST_TAG: ${{ steps.diff.outputs.last_tag }}
        run: |
          set -euo pipefail
          echo "No commits since $LAST_TAG. Silent exit."

      - name: Compose TrainState
        id: compose
        if: steps.diff.outputs.empty == 'false'
        uses: signapse/reusable-workflows/actions/release-train@main
        with:
          last_tag: ${{ steps.diff.outputs.last_tag }}
          linear_team_key: ${{ inputs.linear_team_key }}
          sentry_org: ${{ inputs.sentry_org }}
          sentry_project: ${{ inputs.sentry_project }}
          staging_check_pattern: ${{ inputs.staging_check_pattern }}
          serialization_detector_paths: ${{ inputs.serialization_detector_paths }}
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          GH_TOKEN: ${{ github.token }}

      - name: Create draft release (ready variant only)
        id: draft
        if: steps.compose.outputs.variant == 'ready'
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_VERSION: ${{ steps.compose.outputs.next_version }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          nv="$NEXT_VERSION"
          url=$(gh release create "$nv" --draft --generate-notes --title "$nv" --target "$SHA")
          echo "draft_url=$url" >> "$GITHUB_OUTPUT"

      - name: Compose Slack payload
        id: payload
        if: steps.diff.outputs.empty == 'false'
        env:
          ACTION_PATH: ${{ steps.compose.outputs.action_path }}
          SLACK_RELEASE_CLICKERS_GROUP_ID: ${{ inputs.slack_release_clickers_group_id || vars.SLACK_RELEASE_CLICKERS_GROUP_ID }}
          SLACK_RELEASES_CHANNEL: ${{ inputs.slack_releases_channel || vars.SLACK_RELEASES_CHANNEL || '#releases' }}
          VARIANT: ${{ steps.compose.outputs.variant }}
          STATE: ${{ steps.compose.outputs.state }}
          DRAFT_URL: ${{ steps.draft.outputs.draft_url }}
        run: |
          set -euo pipefail
          variant="$VARIANT"
          state="$STATE"
          if [ "$variant" = "ready" ]; then
            payload=$(echo "$state" | "$ACTION_PATH/scripts/slack-composer.sh" --variant ready --draft-url "$DRAFT_URL")
          else
            payload=$(echo "$state" | "$ACTION_PATH/scripts/slack-composer.sh" --variant held)
          fi
          echo "$payload" > /tmp/slack.json

      - name: Post to Slack
        id: post
        if: steps.diff.outputs.empty == 'false'
        env:
          ACTION_PATH: ${{ steps.compose.outputs.action_path }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          VARIANT: ${{ steps.compose.outputs.variant }}
          NEXT_VERSION: ${{ steps.compose.outputs.next_version }}
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          source "$ACTION_PATH/lib/slack.sh"
          resp=$(slack_post < /tmp/slack.json)
          ok=$(echo "$resp" | jq -r .ok)
          if [ "$ok" != "true" ]; then
            echo "::error::slack post failed: $resp"
            exit 1
          fi
          ts=$(echo "$resp" | jq -r .ts)
          ch=$(echo "$resp" | jq -r .channel)
          echo "alert_ts=$ts" >> "$GITHUB_OUTPUT"

          if [ "$VARIANT" = "ready" ]; then
            # shellcheck source=/dev/null
            source "$ACTION_PATH/scripts/release-metadata.sh"
            release_meta_set "$NEXT_VERSION" \
              "slack_channel=$ch" \
              "slack_ts=$ts"
          fi

  post-publish:
    if: inputs.selection_mode == 'ready-for-prod' && github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write        # release-metadata reads the release body
      pull-requests: read    # unchanged from the old workflow-level grant
      checks: read
    env:
      DEPLOY_TO_PROD_URL: ${{ inputs.deploy_to_prod_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # This job never invokes the composite action, so its scripts are not on
      # disk. Check them out explicitly rather than `git clone`-ing: same effect,
      # but the ref is visible and Phase 1 flips it to v1 alongside the callers.
      - name: Fetch release-train scripts
        uses: actions/checkout@v4
        with:
          repository: signapse/reusable-workflows
          # Scripts from the same commit as this workflow, not mutable main. An
          # empty workflow_sha would silently check out main, so fail instead.
          ref: ${{ job.workflow_sha || 'job.workflow_sha-is-empty' }}
          path: _rw
          persist-credentials: false

      - name: Install jq
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y jq

      - name: Post prod-promotion prompt
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          SLACK_RELEASES_CHANNEL: ${{ inputs.slack_releases_channel || vars.SLACK_RELEASES_CHANNEL || '#releases' }}
          SLACK_RELEASE_CLICKERS_GROUP_ID: ${{ inputs.slack_release_clickers_group_id || vars.SLACK_RELEASE_CLICKERS_GROUP_ID }}
        run: |
          set -euo pipefail
          RT="$GITHUB_WORKSPACE/_rw/actions/release-train"

          # shellcheck source=/dev/null
          source "$RT/scripts/release-metadata.sh"
          CH=$(release_meta_get "$TAG" slack_channel)
          TS=$(release_meta_get "$TAG" slack_ts)

          mention=""
          if [ -n "${SLACK_RELEASE_CLICKERS_GROUP_ID:-}" ]; then
            mention=" <!subteam^${SLACK_RELEASE_CLICKERS_GROUP_ID}>"
          fi
          msg="🚀 \`${TAG}\` retagged and ready for prod. <${DEPLOY_TO_PROD_URL}|Deploy to Prod ↗>${mention}"

          # shellcheck source=/dev/null
          source "$RT/lib/slack.sh"
          if [ -n "$CH" ] && [ -n "$TS" ]; then
            resp=$(slack_thread_reply "$CH" "$TS" "$msg")
          else
            echo "::warning::no slack coord for ${TAG}; posting fresh message to ${SLACK_RELEASES_CHANNEL}"
            resp=$(jq -nc --arg c "$SLACK_RELEASES_CHANNEL" --arg t "$msg" \
              '{channel: $c, text: $t}' | slack_post)
          fi
          if [ "$(echo "$resp" | jq -r .ok)" != "true" ]; then
            echo "::error::post-publish slack post failed: $resp"
            exit 1
          fi
