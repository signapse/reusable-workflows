name: Deploy Go Lambda (Reusable)

on:
  workflow_call:
    inputs:
      go_version:
        description: 'Go version to use'
        required: false
        type: string
        default: '1.23'

      main_file_path:
        description: 'Path to the main.go file (e.g., cmd/api/lambda/main.go)'
        required: true
        type: string

      output_binary_name:
        description: 'Name of the output binary'
        required: false
        type: string
        default: 'bootstrap'

      zip_file_name:
        description: 'Name of the zip file to create'
        required: true
        type: string

      lambda_function_name:
        description: 'Name of the Lambda function to update (use this OR lambda_function_name_secret)'
        required: false
        type: string
        default: ''

      s3_bucket:
        description: 'S3 bucket name for Lambda deployment'
        required: true
        type: string

      s3_key:
        description: 'S3 key/path for the Lambda zip file (e.g., hub-platform-api/function.zip)'
        required: true
        type: string

      aws_region:
        description: 'AWS region'
        required: false
        type: string
        default: 'eu-west-2'

      aws_role_arn:
        description: 'AWS IAM role ARN for OIDC authentication'
        required: true
        type: string

      goprivate:
        description: 'GOPRIVATE environment variable value'
        required: false
        type: string
        default: 'github.com/signapse/*'

      enable_private_repos:
        description: 'Enable access to private signapse/* modules (GitHub App token, or github_pat fallback)'
        required: false
        type: boolean
        default: false

      go_build_flags:
        description: 'Additional Go build flags (e.g., -ldflags="-s -w")'
        required: false
        type: string
        default: ''

      go_arch:
        description: 'Target architecture for the Go binary (e.g., amd64, arm64)'
        required: false
        type: string
        default: 'arm64'

      app_version:
        description: 'Application version to display in the Lambda description (e.g., v1.2.3, github.event.release.tag_name)'
        required: false
        type: string
        default: ''

      # Deployment Options
      publish_version:
        description: 'Publish a new Lambda version after deployment'
        required: false
        type: boolean
        default: false

      update_alias:
        description: 'Lambda alias to update (e.g., "live", "production"). Leave empty to skip.'
        required: false
        type: string
        default: ''

      verify_deployment:
        description: 'Verify function reaches Active state after update'
        required: false
        type: boolean
        default: false

      smoke_test_payload:
        description: 'JSON payload for smoke test invocation (leave empty to skip smoke test)'
        required: false
        type: string
        default: ''

    secrets:
      CI_GITHUB_APP_PRIVATE_KEY:
        description: 'Private key of the read-only CI GitHub App (SIG-2792). With the org variable CI_GITHUB_APP_ID it mints a per-run token for private signapse/* modules. Preferred over github_pat.'
        required: false

      github_pat:
        description: 'DEPRECATED fallback: GitHub PAT for private repositories, used only when the App credentials are absent. Remove once every caller passes CI_GITHUB_APP_PRIVATE_KEY.'
        required: false

      lambda_function_name_secret:
        description: 'Lambda function name from secrets (alternative to lambda_function_name input, for per-environment secrets)'
        required: false

permissions:
  id-token: write   # Required for OIDC authentication
  contents: read    # Required to checkout code

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go_version }}

      # Private-module access: mint a read-only GitHub App token when the org
      # variable CI_GITHUB_APP_ID and the CI_GITHUB_APP_PRIVATE_KEY secret are
      # both present (secrets go through env because `if:` cannot read them);
      # otherwise fall back to the PAT secret so unmigrated callers keep working.
      - name: Check for GitHub App credentials
        id: app
        if: ${{ inputs.enable_private_repos }}
        env:
          APP_ID: ${{ vars.CI_GITHUB_APP_ID }}
          APP_KEY: ${{ secrets.CI_GITHUB_APP_PRIVATE_KEY }}
        run: |
          if [ -n "$APP_ID" ] && [ -n "$(printf '%s' "$APP_KEY" | tr -d '[:space:]')" ]; then
            echo "use_app=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Mint read-only GitHub App token
        id: deps
        if: ${{ steps.app.outputs.use_app == 'true' }}
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349  # v2.2.2
        with:
          app-id: ${{ vars.CI_GITHUB_APP_ID }}
          private-key: ${{ secrets.CI_GITHUB_APP_PRIVATE_KEY }}
          owner: signapse
          permission-contents: read

      - name: Configure access to private repos
        if: ${{ inputs.enable_private_repos }}
        env:
          DEPS_TOKEN: ${{ steps.deps.outputs.token || secrets.github_pat }}
          USE_APP: ${{ steps.app.outputs.use_app }}
        run: |
          if [ "$USE_APP" = "true" ]; then
            # An installation token only reaches the repos the App is installed on,
            # all under signapse, so scope the rewrite to that owner.
            git config --global url."https://x-access-token:${DEPS_TOKEN}@github.com/signapse/".insteadOf "https://github.com/signapse/"
          else
            # PAT fallback: unchanged behaviour. A PAT can also read private modules
            # in other orgs listed in goprivate, so keep the github.com-wide rewrite.
            git config --global url."https://${DEPS_TOKEN}@github.com/".insteadOf "https://github.com/"
          fi

      - name: Build Lambda function
        run: |
          # go_build_flags is a space-separated flag list, so it is word-split on purpose.
          # shellcheck disable=SC2086
          go build ${GO_BUILD_FLAGS} -o "${OUTPUT_BINARY_NAME}" "${MAIN_FILE_PATH}"
          zip "${ZIP_FILE_NAME}" "${OUTPUT_BINARY_NAME}"
          echo "Built and zipped Lambda function: ${ZIP_FILE_NAME}"
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: ${{ inputs.go_arch }}
          GOPRIVATE: ${{ inputs.goprivate }}
          GO_BUILD_FLAGS: ${{ inputs.go_build_flags }}
          OUTPUT_BINARY_NAME: ${{ inputs.output_binary_name }}
          MAIN_FILE_PATH: ${{ inputs.main_file_path }}
          ZIP_FILE_NAME: ${{ inputs.zip_file_name }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.aws_role_arn }}
          aws-region: ${{ inputs.aws_region }}

      - name: Resolve function name
        id: resolve-name
        env:
          LAMBDA_FUNCTION_NAME: ${{ inputs.lambda_function_name }}
          LAMBDA_FUNCTION_NAME_SECRET: ${{ secrets.lambda_function_name_secret }}
        run: |
          if [ -n "${LAMBDA_FUNCTION_NAME}" ]; then
            echo "function_name=${LAMBDA_FUNCTION_NAME}" >> $GITHUB_OUTPUT
          elif [ -n "${LAMBDA_FUNCTION_NAME_SECRET}" ]; then
            echo "function_name=${LAMBDA_FUNCTION_NAME_SECRET}" >> $GITHUB_OUTPUT
          else
            echo "Error: Either lambda_function_name input or lambda_function_name_secret must be provided"
            exit 1
          fi

      - name: Upload to S3
        env:
          ZIP_FILE_NAME: ${{ inputs.zip_file_name }}
          S3_BUCKET: ${{ inputs.s3_bucket }}
          S3_KEY: ${{ inputs.s3_key }}
        run: |
          aws s3 cp "${ZIP_FILE_NAME}" "s3://${S3_BUCKET}/${S3_KEY}"
          echo "Uploaded to S3: s3://${S3_BUCKET}/${S3_KEY}"

      - name: Update Lambda function
        env:
          FUNCTION_NAME: ${{ steps.resolve-name.outputs.function_name }}
          S3_BUCKET: ${{ inputs.s3_bucket }}
          S3_KEY: ${{ inputs.s3_key }}
          REGION: ${{ inputs.aws_region }}
        run: |
          aws lambda update-function-code \
            --function-name "${FUNCTION_NAME}" \
            --s3-bucket "${S3_BUCKET}" \
            --s3-key "${S3_KEY}" \
            --region "${REGION}"
          echo "Lambda function updated successfully"

      - name: Wait for Lambda update to complete
        env:
          FUNCTION_NAME: ${{ steps.resolve-name.outputs.function_name }}
          REGION: ${{ inputs.aws_region }}
        run: |
          echo "Waiting for Lambda function update to complete..."
          aws lambda wait function-updated \
            --function-name "${FUNCTION_NAME}" \
            --region "${REGION}"
          echo "Lambda function is now active and updated"

      - name: Update Lambda description with version
        if: ${{ inputs.app_version != '' }}
        env:
          FUNCTION_NAME: ${{ steps.resolve-name.outputs.function_name }}
          APP_VERSION: ${{ inputs.app_version }}
          REGION: ${{ inputs.aws_region }}
        run: |
          FUNC_NAME="${FUNCTION_NAME}"
          DESCRIPTION="Version: ${APP_VERSION} | Deployed: $(date -u +"%Y-%m-%dT%H:%M:%SZ") | Commit: ${GITHUB_SHA:0:7}"

          aws lambda update-function-configuration \
            --function-name "${FUNC_NAME}" \
            --description "${DESCRIPTION}" \
            --region "${REGION}"

          echo "Updated description: ${DESCRIPTION}"

          aws lambda wait function-updated \
            --function-name "${FUNC_NAME}" \
            --region "${REGION}"

      - name: Publish version
        if: ${{ inputs.publish_version }}
        id: publish-version
        env:
          FUNCTION_NAME: ${{ steps.resolve-name.outputs.function_name }}
        run: |
          RESULT=$(aws lambda publish-version \
            --function-name "${FUNCTION_NAME}" \
            --output json)

          VERSION=$(echo "$RESULT" | jq -r '.Version')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Published version: $VERSION"

      - name: Update alias
        if: ${{ inputs.update_alias != '' && inputs.publish_version }}
        env:
          FUNCTION_NAME: ${{ steps.resolve-name.outputs.function_name }}
          PUBLISHED_VERSION: ${{ steps.publish-version.outputs.version }}
          UPDATE_ALIAS: ${{ inputs.update_alias }}
        run: |
          FUNC_NAME="${FUNCTION_NAME}"
          VERSION="${PUBLISHED_VERSION}"

          if aws lambda get-alias \
            --function-name "$FUNC_NAME" \
            --name "${UPDATE_ALIAS}" \
            >/dev/null 2>&1; then
            aws lambda update-alias \
              --function-name "$FUNC_NAME" \
              --name "${UPDATE_ALIAS}" \
              --function-version "$VERSION"
          else
            aws lambda create-alias \
              --function-name "$FUNC_NAME" \
              --name "${UPDATE_ALIAS}" \
              --function-version "$VERSION"
          fi

          echo "Alias '${UPDATE_ALIAS}' now points to version $VERSION"

      - name: Verify deployment
        if: ${{ inputs.verify_deployment }}
        env:
          FUNCTION_NAME: ${{ steps.resolve-name.outputs.function_name }}
        run: |
          FUNC_INFO=$(aws lambda get-function \
            --function-name "${FUNCTION_NAME}" \
            --output json)

          STATE=$(echo "$FUNC_INFO" | jq -r '.Configuration.State')
          LAST_UPDATE=$(echo "$FUNC_INFO" | jq -r '.Configuration.LastUpdateStatus')

          echo "State: $STATE"
          echo "Last Update Status: $LAST_UPDATE"

          if [ "$STATE" != "Active" ] || [ "$LAST_UPDATE" != "Successful" ]; then
            echo "Deployment verification failed!"
            exit 1
          fi

          echo "Deployment verified successfully"

      - name: Smoke test
        if: ${{ inputs.smoke_test_payload != '' }}
        env:
          FUNCTION_NAME: ${{ steps.resolve-name.outputs.function_name }}
          UPDATE_ALIAS: ${{ inputs.update_alias }}
          PUBLISH_VERSION: ${{ inputs.publish_version }}
          SMOKE_TEST_PAYLOAD: ${{ inputs.smoke_test_payload }}
        run: |
          FUNC_NAME="${FUNCTION_NAME}"

          QUALIFIER=""
          if [ -n "${UPDATE_ALIAS}" ] && [ "${PUBLISH_VERSION}" == "true" ]; then
            QUALIFIER="--qualifier ${UPDATE_ALIAS}"
          fi

          aws lambda invoke \
            --function-name "$FUNC_NAME" \
            $QUALIFIER \
            --payload "${SMOKE_TEST_PAYLOAD}" \
            --cli-binary-format raw-in-base64-out \
            /tmp/smoke-test-response.json

          echo "Response:"
          cat /tmp/smoke-test-response.json
          echo ""

      - name: Get Lambda function info
        env:
          FUNCTION_NAME: ${{ steps.resolve-name.outputs.function_name }}
          REGION: ${{ inputs.aws_region }}
        run: |
          aws lambda get-function \
            --function-name "${FUNCTION_NAME}" \
            --region "${REGION}" \
            --query 'Configuration.[FunctionName,LastModified,CodeSize,Version]' \
            --output table
