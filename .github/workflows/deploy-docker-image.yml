name: Deploy Docker Image

on:
  workflow_call:
    inputs:
      service_type:
        description: 'AWS service type (lambda, ecs, eks)'
        required: true
        type: string

      service_name:
        description: 'Service/function name (Lambda function name, ECS service name, EKS deployment name). Can be provided via input or secret.'
        required: false
        type: string
        default: ''

      image_uri:
        description: 'Full Docker image URI including tag (e.g., 123456789.dkr.ecr.us-east-1.amazonaws.com/my-app:v1.0.0)'
        required: true
        type: string

      aws_region:
        description: 'AWS region'
        required: true
        type: string

      iam_role_arn:
        description: 'IAM role ARN for AWS authentication via OIDC'
        required: true
        type: string

      # Optional parameters for specific services
      cluster_name:
        description: '[ECS/EKS] Cluster name'
        required: false
        type: string
        default: ''

      namespace:
        description: '[EKS] Kubernetes namespace'
        required: false
        type: string
        default: 'default'

      container_name:
        description: '[EKS] Container name in the deployment'
        required: false
        type: string
        default: ''

      wait_for_completion:
        description: 'Wait for deployment to complete'
        required: false
        type: boolean
        default: true

    secrets:
      service_name_secret:
        description: 'Service/function name from secrets (alternative to service_name input)'
        required: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      # Use input service_name if provided, otherwise use secret
      SERVICE_NAME: ${{ inputs.service_name != '' && inputs.service_name || secrets.service_name_secret }}

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.iam_role_arn }}
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: ${{ inputs.aws_region }}

      - name: Validate inputs
        run: |
          if [ -z "$SERVICE_NAME" ]; then
            echo "❌ Error: service_name must be provided either as input or secret (service_name_secret)"
            exit 1
          fi
          echo "✅ Service name: $SERVICE_NAME"

      - name: Validate service type
        env:
          SERVICE_TYPE: ${{ inputs.service_type }}
        run: |
          VALID_TYPES="lambda ecs eks"
          # Quoted on purpose: a literal word match, not a regex.
          # shellcheck disable=SC2076
          if [[ ! " $VALID_TYPES " =~ " ${SERVICE_TYPE} " ]]; then
            echo "❌ Error: Invalid service_type '${SERVICE_TYPE}'"
            echo "Valid types: $VALID_TYPES"
            exit 1
          fi
          echo "✅ Service type: ${SERVICE_TYPE}"

      # ========================================
      # Lambda Deployment
      # ========================================
      - name: Deploy to AWS Lambda
        if: inputs.service_type == 'lambda'
        env:
          IMAGE_URI: ${{ inputs.image_uri }}
          REGION: ${{ inputs.aws_region }}
        run: |
          echo "=========================================="
          echo "🚀 Deploying to AWS Lambda"
          echo "=========================================="
          echo "Function: $SERVICE_NAME"
          echo "Image: ${IMAGE_URI}"
          echo "Region: ${REGION}"
          echo "=========================================="

          aws lambda update-function-code \
            --function-name "$SERVICE_NAME" \
            --image-uri "${IMAGE_URI}" \
            --publish

          echo "✅ Lambda function updated"

      - name: Wait for Lambda deployment
        if: inputs.service_type == 'lambda' && inputs.wait_for_completion
        run: |
          echo "⏳ Waiting for Lambda function to be ready..."

          max_attempts=30
          attempt=0

          while [ $attempt -lt $max_attempts ]; do
            STATUS=$(aws lambda get-function \
              --function-name "$SERVICE_NAME" \
              --query 'Configuration.LastUpdateStatus' \
              --output text)

            echo "Attempt $((attempt + 1))/$max_attempts - Status: $STATUS"

            if [ "$STATUS" == "Successful" ]; then
              echo "✅ Deployment completed successfully!"
              exit 0
            elif [ "$STATUS" == "Failed" ]; then
              echo "❌ Deployment failed!"
              aws lambda get-function \
                --function-name "$SERVICE_NAME" \
                --query 'Configuration.LastUpdateStatusReason'
              exit 1
            fi

            attempt=$((attempt + 1))
            sleep 10
          done

          echo "❌ Timeout waiting for deployment"
          exit 1

      - name: Get Lambda function details
        if: inputs.service_type == 'lambda'
        run: |
          echo "=========================================="
          echo "📋 Lambda Function Details"
          echo "=========================================="
          aws lambda get-function \
            --function-name "$SERVICE_NAME" \
            --query 'Configuration.{Name:FunctionName,Version:Version,State:State,LastModified:LastModified}' \
            --output table
          echo "=========================================="

      # ========================================
      # ECS Deployment
      # ========================================
      - name: Deploy to ECS
        if: inputs.service_type == 'ecs'
        env:
          CLUSTER_NAME: ${{ inputs.cluster_name }}
          IMAGE_URI: ${{ inputs.image_uri }}
        run: |
          if [ -z "${CLUSTER_NAME}" ]; then
            echo "❌ Error: cluster_name is required for ECS deployments"
            exit 1
          fi

          echo "=========================================="
          echo "🚀 Deploying to Amazon ECS"
          echo "=========================================="
          echo "Cluster: ${CLUSTER_NAME}"
          echo "Service: $SERVICE_NAME"
          echo "Image: ${IMAGE_URI}"
          echo "=========================================="

          # Force new deployment with the new image
          aws ecs update-service \
            --cluster "${CLUSTER_NAME}" \
            --service "$SERVICE_NAME" \
            --force-new-deployment

          echo "✅ ECS service update initiated"

      - name: Wait for ECS deployment
        if: inputs.service_type == 'ecs' && inputs.wait_for_completion
        env:
          CLUSTER_NAME: ${{ inputs.cluster_name }}
        run: |
          echo "⏳ Waiting for ECS service to stabilize..."

          aws ecs wait services-stable \
            --cluster "${CLUSTER_NAME}" \
            --services "$SERVICE_NAME"

          echo "✅ ECS deployment completed successfully!"

      - name: Get ECS service details
        if: inputs.service_type == 'ecs'
        env:
          CLUSTER_NAME: ${{ inputs.cluster_name }}
        run: |
          echo "=========================================="
          echo "📋 ECS Service Details"
          echo "=========================================="
          aws ecs describe-services \
            --cluster "${CLUSTER_NAME}" \
            --services "$SERVICE_NAME" \
            --query 'services[0].{Name:serviceName,Status:status,Running:runningCount,Desired:desiredCount}' \
            --output table
          echo "=========================================="

      # ========================================
      # EKS Deployment
      # ========================================
      - name: Deploy to EKS
        if: inputs.service_type == 'eks'
        env:
          CLUSTER_NAME: ${{ inputs.cluster_name }}
          NAMESPACE: ${{ inputs.namespace }}
          IMAGE_URI: ${{ inputs.image_uri }}
          REGION: ${{ inputs.aws_region }}
          CONTAINER_NAME_INPUT: ${{ inputs.container_name }}
        run: |
          if [ -z "${CLUSTER_NAME}" ]; then
            echo "❌ Error: cluster_name is required for EKS deployments"
            exit 1
          fi

          echo "=========================================="
          echo "🚀 Deploying to Amazon EKS"
          echo "=========================================="
          echo "Cluster: ${CLUSTER_NAME}"
          echo "Deployment: $SERVICE_NAME"
          echo "Namespace: ${NAMESPACE}"
          echo "Image: ${IMAGE_URI}"
          echo "=========================================="

          # Configure kubectl
          aws eks update-kubeconfig \
            --name "${CLUSTER_NAME}" \
            --region "${REGION}"

          # Determine container name (use input or deployment name)
          CONTAINER_NAME="${CONTAINER_NAME_INPUT}"
          if [ -z "$CONTAINER_NAME" ]; then
            CONTAINER_NAME="$SERVICE_NAME"
          fi

          # Update deployment image
          kubectl set image deployment/$SERVICE_NAME \
            "$CONTAINER_NAME=${IMAGE_URI}" \
            --namespace "${NAMESPACE}"

          echo "✅ EKS deployment updated"

      - name: Wait for EKS deployment
        if: inputs.service_type == 'eks' && inputs.wait_for_completion
        env:
          NAMESPACE: ${{ inputs.namespace }}
        run: |
          echo "⏳ Waiting for EKS rollout to complete..."

          kubectl rollout status deployment/$SERVICE_NAME \
            --namespace "${NAMESPACE}" \
            --timeout=10m

          echo "✅ EKS deployment completed successfully!"

      - name: Get EKS deployment details
        if: inputs.service_type == 'eks'
        env:
          NAMESPACE: ${{ inputs.namespace }}
        run: |
          echo "=========================================="
          echo "📋 EKS Deployment Details"
          echo "=========================================="
          kubectl get deployment $SERVICE_NAME \
            --namespace "${NAMESPACE}" \
            --output wide
          echo ""
          kubectl get pods \
            --namespace "${NAMESPACE}" \
            --selector=app=$SERVICE_NAME \
            --output wide
          echo "=========================================="

      # ========================================
      # Deployment Summary
      # ========================================
      - name: Deployment Summary
        if: always()
        env:
          SERVICE_TYPE: ${{ inputs.service_type }}
          IMAGE_URI: ${{ inputs.image_uri }}
          REGION: ${{ inputs.aws_region }}
        run: |
          echo ""
          echo "=========================================="
          echo "✨ Deployment Summary"
          echo "=========================================="
          echo "Service Type: ${SERVICE_TYPE}"
          echo "Service Name: $SERVICE_NAME"
          echo "Image URI: ${IMAGE_URI}"
          echo "Region: ${REGION}"
          echo "Timestamp: $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
          echo "=========================================="
