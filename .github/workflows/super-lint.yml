name: Super Linter

on:
  workflow_call:
    inputs:
      run-lint:
        description: "Run Super-Linter"
        required: false
        type: boolean
        default: true
      extra-super-linter-env:
        description: "Extra Super-Linter env vars as KEY=VALUE pairs separated by newlines (e.g. VALIDATE_CHECKOV=false)"
        required: false
        type: string
        default: ""
      disable-checkov:
        description: "Disable CHECKOV linter"
        required: false
        type: boolean
        default: false
      disable-jscpd:
        description: "Disable JSCPD linter"
        required: false
        type: boolean
        default: false
      disable-gitleaks:
        description: "Disable GITLEAKS linter"
        required: false
        type: boolean
        default: false
      disable-eslint:
        description: "Disable ESLint-based linters (JS, JSX, TS, TSX, JSON, JSONC). Use for repos with ESLint flat config (eslint.config.js)"
        required: false
        type: boolean
        default: false
      jscpd-threshold:
        description: "JSCPD duplication threshold percentage (0-100). Set to 0 to use repo .jscpd.json or jscpd default"
        required: false
        type: number
        default: 0

jobs:
  lint:
    if: ${{ inputs.run-lint }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch full Git history for super-linter

      - name: Parse extra env vars
        if: ${{ inputs.extra-super-linter-env != '' }}
        env:
          EXTRA_SUPER_LINTER_ENV: ${{ inputs.extra-super-linter-env }}
        run: |
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            echo "$line" >> "$GITHUB_ENV"
          done <<< "${EXTRA_SUPER_LINTER_ENV}"

      - name: Set linter overrides
        env:
          DISABLE_CHECKOV: ${{ inputs.disable-checkov }}
          DISABLE_JSCPD: ${{ inputs.disable-jscpd }}
          DISABLE_GITLEAKS: ${{ inputs.disable-gitleaks }}
          DISABLE_ESLINT: ${{ inputs.disable-eslint }}
        run: |
          if [ "${DISABLE_CHECKOV}" = "true" ]; then
            echo "VALIDATE_CHECKOV=false" >> "$GITHUB_ENV"
          fi
          if [ "${DISABLE_JSCPD}" = "true" ]; then
            echo "VALIDATE_JSCPD=false" >> "$GITHUB_ENV"
          fi
          if [ "${DISABLE_GITLEAKS}" = "true" ]; then
            echo "VALIDATE_GITLEAKS=false" >> "$GITHUB_ENV"
          fi
          if [ "${DISABLE_ESLINT}" = "true" ]; then
            echo "VALIDATE_JAVASCRIPT_ES=false" >> "$GITHUB_ENV"
            echo "VALIDATE_JSX=false" >> "$GITHUB_ENV"
            echo "VALIDATE_TYPESCRIPT_ES=false" >> "$GITHUB_ENV"
            echo "VALIDATE_TSX=false" >> "$GITHUB_ENV"
            echo "VALIDATE_JSON=false" >> "$GITHUB_ENV"
            echo "VALIDATE_JSONC=false" >> "$GITHUB_ENV"
          fi

      - name: Set JSCPD threshold
        if: ${{ inputs.jscpd-threshold > 0 && !inputs.disable-jscpd }}
        env:
          JSCPD_THRESHOLD: ${{ inputs.jscpd-threshold }}
        run: |
          if [ ! -f .jscpd.json ]; then
            printf '{"threshold": %s}\n' "${JSCPD_THRESHOLD}" > .jscpd.json
          else
            # Update threshold in existing config
            tmp=$(mktemp)
            jq --argjson threshold "${JSCPD_THRESHOLD}" '.threshold = $threshold' .jscpd.json > "$tmp" && mv "$tmp" .jscpd.json
          fi

      - name: Run Super-Linter
        uses: super-linter/super-linter@12150456a73e248bdc94d0794898f94e23127c88 # v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: false
          DEFAULT_BRANCH: main
          LOG_LEVEL: NOTICE
          VALIDATE_JAVASCRIPT_STANDARD: false
          VALIDATE_TYPESCRIPT_STANDARD: false
