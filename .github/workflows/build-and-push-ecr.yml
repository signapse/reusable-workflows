name: Build and Push to ECR

on:
  workflow_call:
    inputs:
      ecr_repository_uri:
        description: 'ECR repository URI (e.g., 123456789.dkr.ecr.us-east-1.amazonaws.com/my-app)'
        required: true
        type: string

      aws_region:
        description: 'AWS region where ECR repository is located'
        required: true
        type: string

      iam_role_arn:
        description: 'IAM role ARN for AWS authentication via OIDC'
        required: true
        type: string

      image_tag:
        description: 'Docker image tag (e.g., v1.0.0, release-tag). Will also tag as "latest"'
        required: true
        type: string

      docker_build_args:
        description: 'Docker build arguments (one per line, format: KEY=VALUE)'
        required: false
        type: string
        default: ''

      dockerfile_path:
        description: 'Path to Dockerfile (default: ./Dockerfile)'
        required: false
        type: string
        default: './Dockerfile'

      docker_context:
        description: 'Docker build context path (default: .)'
        required: false
        type: string
        default: '.'

      push_latest:
        description: 'Whether to push :latest tag in addition to specified tag'
        required: false
        type: boolean
        default: true

      environment:
        description: 'GitHub Environment name to pull variables from (e.g., development, staging, production)'
        required: false
        type: string
        default: ''

      # Build Engine
      use_buildx:
        description: 'Use Docker Buildx with GHA cache (recommended for faster builds)'
        required: false
        type: boolean
        default: false

      # Attestations (buildx path only). '' keeps build-push-action's default,
      # which attaches a provenance attestation and pushes an OCI image index.
      provenance:
        description: "Buildx provenance attestation ('' = action default). Set 'false' for Lambda container images"
        required: false
        type: string
        default: ''

      sbom:
        description: "Buildx SBOM attestation ('' = action default). Set 'false' for Lambda container images"
        required: false
        type: string
        default: ''

      # Security Scanning
      enable_trivy_scan:
        description: 'Run Trivy vulnerability scan on the built image'
        required: false
        type: boolean
        default: false

      trivy_severity:
        description: 'Trivy severity levels to report'
        required: false
        type: string
        default: 'HIGH,CRITICAL'

      trivy_exit_code:
        description: 'Trivy exit code on findings (1 = fail the build, 0 = warn only)'
        required: false
        type: string
        default: '0'

    secrets:
      CI_GITHUB_APP_PRIVATE_KEY:
        description: 'Private key of the read-only CI GitHub App (SIG-2792). With the org variable CI_GITHUB_APP_ID it mints a per-run token for private signapse/* modules, exposed ONLY as BuildKit secrets id=gh_token (and id=github_token, same value, for Dockerfiles not yet renamed); never as a build-arg. Used only with use_buildx: true and when private_modules_token is not passed; a caller that still passes the PAT keeps the PAT path.'
        required: false
      private_modules_token:
        description: 'DEPRECATED fallback: PAT for private Go/npm modules, used only when the App credentials are absent. On the buildx path it is exposed as build-arg GITHUB_TOKEN and as BuildKit secrets id=gh_token and id=github_token. On the legacy path it is only passed as --build-arg GITHUB_TOKEN. Non-Go callers (npm) still use this.'
        required: false

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.iam_role_arn }}
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: ${{ inputs.aws_region }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Collect environment build args
        id: collect-args
        env:
          ALL_VARS: ${{ toJSON(vars) }}
          DOCKER_BUILD_ARGS: ${{ inputs.docker_build_args }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          # Start with explicit docker_build_args
          COMBINED_ARGS="${DOCKER_BUILD_ARGS}"

          # Fetch environment variables via GitHub API when environment is set
          if [ -n "${ENVIRONMENT}" ]; then
            echo "Fetching variables from environment: ${ENVIRONMENT}"
            ENV_VARS=$(echo "${ALL_VARS}" | jq -r 'to_entries[] | "\(.key)=\(.value)"')

            if [ -n "${ENV_VARS}" ]; then
              if [ -n "${COMBINED_ARGS}" ]; then
                COMBINED_ARGS=$(printf '%s\n%s' "${COMBINED_ARGS}" "${ENV_VARS}")
              else
                COMBINED_ARGS="${ENV_VARS}"
              fi
              echo "Added environment variables from ${ENVIRONMENT}"
            fi

            # Append environment secrets if available
            if [ -n "${SENTRY_AUTH_TOKEN}" ]; then
              if [ -n "${COMBINED_ARGS}" ]; then
                COMBINED_ARGS=$(printf '%s\nSENTRY_AUTH_TOKEN=%s' "${COMBINED_ARGS}" "${SENTRY_AUTH_TOKEN}")
              else
                COMBINED_ARGS="SENTRY_AUTH_TOKEN=${SENTRY_AUTH_TOKEN}"
              fi
              echo "Added SENTRY_AUTH_TOKEN from environment secrets"
            fi
          fi

          # Output combined args (multiline)
          {
            echo "build_args<<ARGS_EOF"
            echo "${COMBINED_ARGS}"
            echo "ARGS_EOF"
          } >> "${GITHUB_OUTPUT}"

      # Private-module access: mint a read-only GitHub App token only when ALL of
      #   * the org variable CI_GITHUB_APP_ID and the CI_GITHUB_APP_PRIVATE_KEY
      #     secret are present (secrets go through env because `if:` cannot read
      #     them),
      #   * the caller passed no private_modules_token, and
      #   * use_buildx is true (the App token only ever travels as a BuildKit
      #     secret, which the legacy docker build path cannot take).
      # Otherwise behaviour is exactly as before this change. In particular a
      # caller that still passes its PAT keeps the PAT and the GITHUB_TOKEN
      # build-arg even if the org App key reaches it (e.g. via `secrets: inherit`),
      # so passing the key and dropping the PAT is the opt-in.
      - name: Check for GitHub App credentials
        id: app
        env:
          APP_ID: ${{ vars.CI_GITHUB_APP_ID }}
          APP_KEY: ${{ secrets.CI_GITHUB_APP_PRIVATE_KEY }}
          PAT: ${{ secrets.private_modules_token }}
          USE_BUILDX: ${{ inputs.use_buildx }}
        run: |
          if [ -n "$APP_ID" ] && [ -n "$(printf '%s' "$APP_KEY" | tr -d '[:space:]')" ]; then
            if [ -n "$(printf '%s' "$PAT" | tr -d '[:space:]')" ]; then
              echo "::notice title=GitHub App token not used::private_modules_token was passed, so the PAT path is kept. Stop passing it to move this build to the App token."
            elif [ "$USE_BUILDX" != "true" ]; then
              echo "::warning title=GitHub App token not used::use_buildx is false. The App token is only passed as a BuildKit secret, so set use_buildx: true to use it. Private-module downloads in this build get no credentials."
            else
              echo "use_app=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Mint read-only GitHub App token
        id: deps
        if: ${{ steps.app.outputs.use_app == 'true' }}
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349  # v2.2.2
        with:
          app-id: ${{ vars.CI_GITHUB_APP_ID }}
          private-key: ${{ secrets.CI_GITHUB_APP_PRIVATE_KEY }}
          owner: signapse
          permission-contents: read

      # --- Buildx path (when use_buildx is true) ---

      - name: Set up Docker Buildx
        if: ${{ inputs.use_buildx }}
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        if: ${{ inputs.use_buildx }}
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ inputs.ecr_repository_uri }}
          tags: |
            type=raw,value=${{ inputs.image_tag }}
            type=raw,value=latest,enable=${{ inputs.push_latest }}

      - name: Build and push with Buildx
        if: ${{ inputs.use_buildx }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.docker_context }}
          file: ${{ inputs.dockerfile_path }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ${{ steps.collect-args.outputs.build_args }}
            ${{ steps.deps.outputs.token == '' && secrets.private_modules_token && format('GITHUB_TOKEN={0}', secrets.private_modules_token) || '' }}
          # BuildKit secrets, never build-args when the App token is in use.
          # gh_token is the canonical id; github_token is the same value for
          # Dockerfiles that have not been renamed yet.
          secrets: |
            ${{ (steps.deps.outputs.token || secrets.private_modules_token) && format('gh_token={0}', steps.deps.outputs.token || secrets.private_modules_token) || '' }}
            ${{ (steps.deps.outputs.token || secrets.private_modules_token) && format('github_token={0}', steps.deps.outputs.token || secrets.private_modules_token) || '' }}
          provenance: ${{ inputs.provenance }}
          sbom: ${{ inputs.sbom }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- Legacy path (when use_buildx is false — preserves existing behavior) ---

      - name: Build Docker Image
        if: ${{ !inputs.use_buildx }}
        id: build
        env:
          DOCKER_BUILDKIT: 0
          GITHUB_TOKEN_SECRET: ${{ secrets.private_modules_token }}
          COLLECTED_BUILD_ARGS: ${{ steps.collect-args.outputs.build_args }}
        run: |
          # Parse build args if provided
          BUILD_ARGS=()
          if [ -n "${COLLECTED_BUILD_ARGS}" ]; then
            while IFS= read -r line; do
              if [ -n "${line}" ]; then
                BUILD_ARGS+=(--build-arg "${line}")
              fi
            done <<< "${COLLECTED_BUILD_ARGS}"
          fi

          # Append GITHUB_TOKEN build arg if the secret was provided
          if [ -n "${GITHUB_TOKEN_SECRET}" ]; then
            BUILD_ARGS+=(--build-arg "GITHUB_TOKEN=${GITHUB_TOKEN_SECRET}")
          fi

          echo "Building Docker image with tag: ${{ inputs.image_tag }}"
          echo "Build args ($(( ${#BUILD_ARGS[@]} / 2 ))):"
          for ((i=1; i<${#BUILD_ARGS[@]}; i+=2)); do echo "  - ${BUILD_ARGS[$i]%%=*}"; done

          # Build image with latest tag
          docker build "${BUILD_ARGS[@]}" \
            -f ${{ inputs.dockerfile_path }} \
            -t ${{ inputs.ecr_repository_uri }}:latest \
            ${{ inputs.docker_context }}

      - name: Tag Docker Image
        if: ${{ !inputs.use_buildx }}
        run: |
          # Tag with specified version
          docker tag ${{ inputs.ecr_repository_uri }}:latest \
            ${{ inputs.ecr_repository_uri }}:${{ inputs.image_tag }}

          echo "Tagged image with: ${{ inputs.image_tag }}"

      - name: Push Docker Images to ECR
        if: ${{ !inputs.use_buildx }}
        run: |
          # Push versioned tag
          echo "Pushing ${{ inputs.ecr_repository_uri }}:${{ inputs.image_tag }}"
          docker push ${{ inputs.ecr_repository_uri }}:${{ inputs.image_tag }}

          # Push latest tag if enabled
          if [ "${{ inputs.push_latest }}" == "true" ]; then
            echo "Pushing ${{ inputs.ecr_repository_uri }}:latest"
            docker push ${{ inputs.ecr_repository_uri }}:latest
          fi

      # --- Security scanning (optional) ---

      - name: Create shared Trivy ignore file
        if: ${{ inputs.enable_trivy_scan }}
        run: |
          # Append centrally-managed CVE exceptions so every caller inherits them.
          # Review periodically and remove entries once upstream fixes land.
          cat >> .trivyignore <<'EOF'
          # github.com/docker/docker (indirect, test-only)
          # CVE-2026-34040 - Moby authorization bypass. No upstream fix yet.
          CVE-2026-34040
          EOF

      - name: Run Trivy vulnerability scan
        if: ${{ inputs.enable_trivy_scan }}
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ inputs.ecr_repository_uri }}:${{ inputs.image_tag }}'
          format: 'table'
          severity: ${{ inputs.trivy_severity }}
          exit-code: ${{ inputs.trivy_exit_code }}
          trivyignores: '.trivyignore'

      - name: Create deploy_info.json
        run: |
          cat <<EOF > deploy_info.json
          {
            "image_uri_latest": "${{ inputs.ecr_repository_uri }}:latest",
            "image_uri_release": "${{ inputs.ecr_repository_uri }}:${{ inputs.image_tag }}",
            "version": "${{ inputs.image_tag }}",
            "commit_sha": "${{ github.sha }}",
            "repository": "${{ github.repository }}",
            "workflow_run_id": "${{ github.run_id }}",
            "workflow_run_number": "${{ github.run_number }}",
            "actor": "${{ github.actor }}",
            "timestamp": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          }
          EOF

          echo "Deploy info created:"
          cat deploy_info.json

      - name: Upload deploy_info.json artifact
        uses: actions/upload-artifact@v4
        with:
          name: deploy_info-${{ inputs.image_tag }}
          path: deploy_info.json
          retention-days: 90
          overwrite: true
