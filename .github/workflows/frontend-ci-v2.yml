name: Frontend CI v2

on:
  workflow_call:
    inputs:
      node-version:
        description: 'Node.js version to use'
        required: false
        type: string
        default: '18'

      package-manager:
        description: 'Package manager (npm, yarn, pnpm)'
        required: false
        type: string
        default: 'npm'

      run-lint:
        description: 'Run ESLint + Prettier via lint command'
        required: false
        type: boolean
        default: true

      run-typecheck:
        description: 'Run TypeScript type checking (tsc --noEmit)'
        required: false
        type: boolean
        default: true

      run-tests:
        description: 'Run unit tests'
        required: false
        type: boolean
        default: true

      run-build:
        description: 'Run build step'
        required: false
        type: boolean
        default: true

      run-security:
        description: 'Run npm/yarn/pnpm audit for dependency vulnerabilities'
        required: false
        type: boolean
        default: true

      run-docker-lint:
        description: 'Run Hadolint on Dockerfile'
        required: false
        type: boolean
        default: true

      run-super-linter:
        description: 'Run GitHub Super-Linter'
        required: false
        type: boolean
        default: true

      coverage-enabled:
        description: 'Enforce test coverage threshold'
        required: false
        type: boolean
        default: true

      coverage-threshold:
        description: 'Minimum line coverage percentage (global)'
        required: false
        type: number
        default: 80

      coverage-args:
        description: >-
          Extra args appended to test-command when coverage is enabled.
          The default is Jest's flag syntax, which is what this workflow has
          always emitted. Vitest rejects --coverageThreshold, so vitest repos
          must override this (e.g. '--coverage --coverage.thresholds.lines=80').
          coverage-threshold is interpolated into the default only.
        required: false
        type: string
        default: ''

      audit-args:
        description: >-
          Extra args appended verbatim to the package manager's audit command.
          The value is NOT translated between managers, so it must match the one
          this repo uses.

          To gate on production dependencies only — the set that actually ships
          in a container image — pass the flag for your manager:
          npm '--omit=dev'; pnpm '--prod'; Yarn Modern '--environment production';
          Yarn Classic '--groups dependencies'. Passing npm's '--omit=dev' to
          either Yarn fails the audit step on an unknown option rather than
          silently auditing everything.
        required: false
        type: string
        default: ''

      disable-eslint:
        description: >-
          Disable Super-Linter's bundled ESLint linters. Required for repos on
          ESLint flat config (eslint.config.js/.mjs), whose own `lint-command`
          already covers those files.
        required: false
        type: boolean
        default: false

      build-command:
        description: 'Build command to run'
        required: false
        type: string
        default: 'npm run build'

      test-command:
        description: 'Test command to run'
        required: false
        type: string
        default: 'npm test'

      lint-command:
        description: 'Lint command to run'
        required: false
        type: string
        default: 'npm run lint'

      dockerfile-path:
        description: 'Path to Dockerfile for Hadolint'
        required: false
        type: string
        default: './Dockerfile'

      disable-checkov:
        description: 'Disable CHECKOV in Super-Linter'
        required: false
        type: boolean
        default: false

      disable-jscpd:
        description: 'Disable JSCPD in Super-Linter'
        required: false
        type: boolean
        default: false

      disable-gitleaks:
        description: 'Disable GITLEAKS in Super-Linter'
        required: false
        type: boolean
        default: false

      extra-super-linter-env:
        description: 'Extra Super-Linter env vars as KEY=VALUE pairs separated by newlines'
        required: false
        type: string
        default: ''

    secrets:
      private_modules_token:
        description: >-
          Token for private package registries. Exposed to the install steps as
          NPM_TOKEN, which a committed .npmrc can reference, and additionally as
          YARN_NPM_AUTH_TOKEN for Yarn, which Berry reads instead of .npmrc.
          Required for repos
          with private scoped deps as soon as a job resolves versions rather
          than replaying the lockfile — an added or bumped dependency 401s
          without it.
        required: false

jobs:
  # ─── Track 1a: Super-Linter (parallel) ───
  super-lint:
    if: ${{ inputs.run-super-linter }}
    uses: signapse/reusable-workflows/.github/workflows/super-lint.yml@main
    with:
      run-lint: true
      disable-checkov: ${{ inputs.disable-checkov }}
      disable-jscpd: ${{ inputs.disable-jscpd }}
      disable-gitleaks: ${{ inputs.disable-gitleaks }}
      disable-eslint: ${{ inputs.disable-eslint }}
      extra-super-linter-env: ${{ inputs.extra-super-linter-env }}

  # ─── Track 1b: Docker Lint (parallel) ───
  docker-lint:
    if: ${{ inputs.run-docker-lint }}
    uses: signapse/reusable-workflows/.github/workflows/docker-lint.yml@main
    with:
      dockerfile-path: ${{ inputs.dockerfile-path }}

  # ─── Track 2: Frontend Pipeline (sequential) ───
  frontend-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}

      # ── Install dependencies ──
      - name: Install dependencies (npm)
        if: inputs.package-manager == 'npm'
        env:
          NPM_TOKEN: ${{ secrets.private_modules_token }}
        run: npm ci

      # Both tokens, because the two Yarn generations authenticate differently:
      # Classic reads the committed .npmrc (NPM_TOKEN), while Berry ignores
      # .npmrc entirely and takes YARN_NPM_AUTH_TOKEN from the environment. With
      # only NPM_TOKEN a Yarn 2+ repo still 401s on private scoped deps, which
      # is the exact failure this secret exists to prevent.
      - name: Install dependencies (yarn)
        if: inputs.package-manager == 'yarn'
        env:
          NPM_TOKEN: ${{ secrets.private_modules_token }}
          YARN_NPM_AUTH_TOKEN: ${{ secrets.private_modules_token }}
        run: yarn install --frozen-lockfile

      - name: Install dependencies (pnpm)
        if: inputs.package-manager == 'pnpm'
        env:
          NPM_TOKEN: ${{ secrets.private_modules_token }}
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      # ── Lint (ESLint + Prettier) ──
      - name: Lint
        id: lint
        if: ${{ inputs.run-lint }}
        run: ${{ inputs.lint-command }}

      # ── TypeScript type check ──
      - name: Type check
        id: typecheck
        if: ${{ inputs.run-typecheck }}
        run: npx tsc --noEmit

      # ── Unit tests + coverage ──
      - name: Run tests
        id: tests
        if: ${{ inputs.run-tests && !inputs.coverage-enabled }}
        run: ${{ inputs.test-command }}

      - name: Run tests with coverage
        id: tests-coverage
        if: ${{ inputs.run-tests && inputs.coverage-enabled }}
        env:
          COVERAGE_ARGS: ${{ inputs.coverage-args }}
          THRESHOLD: ${{ inputs.coverage-threshold }}
        run: |
          set -euo pipefail
          # An array, not a string: the Jest default embeds double quotes that
          # have to survive as literal characters inside a single argv entry,
          # which word-splitting an unquoted string cannot guarantee.
          if [ -n "$COVERAGE_ARGS" ]; then
            read -r -a args <<< "$COVERAGE_ARGS"
          else
            # Jest's flag syntax — this workflow's long-standing default.
            args=(--coverage "--coverageThreshold={\"global\":{\"lines\":${THRESHOLD},\"branches\":${THRESHOLD},\"functions\":${THRESHOLD},\"statements\":${THRESHOLD}}}")
          fi
          ${{ inputs.test-command }} -- "${args[@]}"

      # ── Build ──
      - name: Build
        id: build
        if: ${{ inputs.run-build }}
        run: ${{ inputs.build-command }}

      # ── Security audit ──
      - name: Security audit (npm)
        id: security-npm
        if: ${{ inputs.run-security && inputs.package-manager == 'npm' }}
        env:
          AUDIT_ARGS: ${{ inputs.audit-args }}
        run: |
          set -euo pipefail
          read -r -a audit_args <<< "${AUDIT_ARGS:-}"
          npm audit --audit-level=high "${audit_args[@]}"
        continue-on-error: false

      - name: Security audit (yarn)
        id: security-yarn
        if: ${{ inputs.run-security && inputs.package-manager == 'yarn' }}
        env:
          AUDIT_ARGS: ${{ inputs.audit-args }}
        run: |
          YARN_MAJOR=$(yarn --version | cut -d. -f1)
          read -r -a audit_args <<< "${AUDIT_ARGS:-}"
          if [ "$YARN_MAJOR" -ge 2 ]; then
            yarn npm audit --severity high "${audit_args[@]}"
          else
            yarn audit --level high "${audit_args[@]}"
          fi
        continue-on-error: false

      - name: Security audit (pnpm)
        id: security-pnpm
        if: ${{ inputs.run-security && inputs.package-manager == 'pnpm' }}
        env:
          AUDIT_ARGS: ${{ inputs.audit-args }}
        run: |
          set -euo pipefail
          read -r -a audit_args <<< "${AUDIT_ARGS:-}"
          pnpm audit --audit-level high "${audit_args[@]}"
        continue-on-error: false

      # ── Upload coverage artifact ──
      - name: Upload coverage report
        if: ${{ always() && inputs.run-tests }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ github.run_id }}
          path: coverage/
          retention-days: 14
          if-no-files-found: ignore

      # ── Summary ──
      - name: CI Summary
        if: always()
        run: |
          status() {
            local outcome="$1"
            case "$outcome" in
              success) echo "✅ Passed" ;;
              failure) echo "❌ Failed" ;;
              skipped|"") echo "⏭️ Skipped" ;;
              *) echo "⏭️ Skipped" ;;
            esac
          }

          LINT_STATUS=$(status "${{ steps.lint.outcome }}")
          TYPECHECK_STATUS=$(status "${{ steps.typecheck.outcome }}")
          BUILD_STATUS=$(status "${{ steps.build.outcome }}")

          # Tests: either with or without coverage
          TEST_OUTCOME="${{ steps.tests.outcome }}${{ steps.tests-coverage.outcome }}"
          TESTS_STATUS=$(status "$(echo "$TEST_OUTCOME" | grep -o 'success\|failure' | head -1)")
          if [ -z "${{ steps.tests.outcome }}${{ steps.tests-coverage.outcome }}" ]; then
            TESTS_STATUS="⏭️ Skipped"
          fi

          # Security: whichever package manager step ran
          SEC_OUTCOME="${{ steps.security-npm.outcome }}${{ steps.security-yarn.outcome }}${{ steps.security-pnpm.outcome }}"
          SECURITY_STATUS=$(status "$(echo "$SEC_OUTCOME" | grep -o 'success\|failure' | head -1)")
          if [ -z "${{ steps.security-npm.outcome }}${{ steps.security-yarn.outcome }}${{ steps.security-pnpm.outcome }}" ]; then
            SECURITY_STATUS="⏭️ Skipped"
          fi

          # Coverage row
          if [ "${{ inputs.coverage-enabled }}" = "true" ] && [ -n "${{ steps.tests-coverage.outcome }}" ]; then
            COVERAGE_ROW="| **Coverage Threshold** | ${{ inputs.coverage-threshold }}% |"
          else
            COVERAGE_ROW="| **Coverage Threshold** | Disabled |"
          fi

          echo "## Frontend CI v2 Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Node Version** | ${{ inputs.node-version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Package Manager** | ${{ inputs.package-manager }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Lint** | ${LINT_STATUS} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Type Check** | ${TYPECHECK_STATUS} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Tests** | ${TESTS_STATUS} |" >> $GITHUB_STEP_SUMMARY
          echo "${COVERAGE_ROW}" >> $GITHUB_STEP_SUMMARY
          echo "| **Build** | ${BUILD_STATUS} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Security Audit** | ${SECURITY_STATUS} |" >> $GITHUB_STEP_SUMMARY
