name: migration-safety CI
on:
  push:
    branches: [main]
    paths:
      - 'actions/migration-safety/**'
      - '.github/workflows/migration-safety*.yml'
  pull_request:
    paths:
      - 'actions/migration-safety/**'
      - '.github/workflows/migration-safety*.yml'

permissions:
  contents: read

jobs:
  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bats + jq
        run: |
          sudo apt-get update
          sudo apt-get install -y bats jq
      - name: Shellcheck
        run: shellcheck -x actions/migration-safety/scripts/*.sh
      - name: Run bats
        working-directory: actions/migration-safety/test
        run: bats .
