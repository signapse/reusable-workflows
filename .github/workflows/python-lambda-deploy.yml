name: Deploy Python Lambda (Reusable)

on:
  workflow_call:
    inputs:
      python_version:
        description: 'Python version to use'
        required: false
        type: string
        default: '3.12'

      source_dir:
        description: 'Directory containing Lambda function code'
        required: false
        type: string
        default: '.'

      requirements_file:
        description: 'Path to requirements file'
        required: false
        type: string
        default: 'requirements.txt'

      handler:
        description: 'Lambda handler (e.g., app.handler)'
        required: false
        type: string
        default: ''

      zip_file_name:
        description: 'Name of the zip file to create'
        required: true
        type: string

      lambda_function_name:
        description: 'Name of the Lambda function to update (use this OR lambda_function_name_secret)'
        required: false
        type: string
        default: ''

      s3_bucket:
        description: 'S3 bucket name for Lambda deployment'
        required: true
        type: string

      s3_key:
        description: 'S3 key/path for the Lambda zip file'
        required: true
        type: string

      aws_region:
        description: 'AWS region'
        required: false
        type: string
        default: 'eu-west-2'

      aws_role_arn:
        description: 'AWS IAM role ARN for OIDC authentication'
        required: true
        type: string

      exclude_patterns:
        description: 'Patterns to exclude from zip (space-separated)'
        required: false
        type: string
        default: '__pycache__/* *.pyc *.pyo .pytest_cache/* .coverage tests/* .env* .git* .github/*'

      app_version:
        description: 'Application version to display in the Lambda description'
        required: false
        type: string
        default: ''

      publish_version:
        description: 'Publish a new Lambda version after deployment'
        required: false
        type: boolean
        default: false

      update_alias:
        description: 'Lambda alias to update (e.g., "live", "production"). Leave empty to skip.'
        required: false
        type: string
        default: ''

      verify_deployment:
        description: 'Verify function reaches Active state after update'
        required: false
        type: boolean
        default: false

      smoke_test_payload:
        description: 'JSON payload for smoke test invocation (leave empty to skip smoke test)'
        required: false
        type: string
        default: ''

    secrets:
      lambda_function_name_secret:
        description: 'Lambda function name from secrets (alternative to lambda_function_name input)'
        required: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}

      - name: Install dependencies and package
        env:
          SOURCE_DIR: ${{ inputs.source_dir }}
          REQUIREMENTS_FILE: ${{ inputs.requirements_file }}
          EXCLUDE_PATTERNS: ${{ inputs.exclude_patterns }}
          ZIP_FILE_NAME: ${{ inputs.zip_file_name }}
        run: |
          mkdir -p /tmp/lambda-package

          # Install dependencies into package directory
          if [ -f "${SOURCE_DIR}/${REQUIREMENTS_FILE}" ]; then
            pip install -r "${SOURCE_DIR}/${REQUIREMENTS_FILE}" -t /tmp/lambda-package
          fi

          # Copy source code into package directory
          cp -r "${SOURCE_DIR}"/* /tmp/lambda-package/ 2>/dev/null || true
          cp -r "${SOURCE_DIR}"/*.py /tmp/lambda-package/ 2>/dev/null || true

          # Build exclude args (exclude_patterns is a space-separated list)
          EXCLUDE_ARGS=()
          # shellcheck disable=SC2086
          for pattern in ${EXCLUDE_PATTERNS}; do
            EXCLUDE_ARGS+=(-x "$pattern")
          done

          # Create zip
          cd /tmp/lambda-package
          zip -r "/tmp/${ZIP_FILE_NAME}" . "${EXCLUDE_ARGS[@]}"
          echo "Built Lambda package: ${ZIP_FILE_NAME}"
          ls -lh "/tmp/${ZIP_FILE_NAME}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.aws_role_arn }}
          aws-region: ${{ inputs.aws_region }}

      - name: Resolve function name
        id: resolve-name
        env:
          LAMBDA_FUNCTION_NAME: ${{ inputs.lambda_function_name }}
          LAMBDA_FUNCTION_NAME_SECRET: ${{ secrets.lambda_function_name_secret }}
        run: |
          if [ -n "${LAMBDA_FUNCTION_NAME}" ]; then
            echo "function_name=${LAMBDA_FUNCTION_NAME}" >> "$GITHUB_OUTPUT"
          elif [ -n "${LAMBDA_FUNCTION_NAME_SECRET}" ]; then
            echo "function_name=${LAMBDA_FUNCTION_NAME_SECRET}" >> "$GITHUB_OUTPUT"
          else
            echo "Error: Either lambda_function_name input or lambda_function_name_secret must be provided"
            exit 1
          fi

      - name: Upload to S3
        env:
          ZIP_FILE_NAME: ${{ inputs.zip_file_name }}
          S3_BUCKET: ${{ inputs.s3_bucket }}
          S3_KEY: ${{ inputs.s3_key }}
        run: |
          aws s3 cp "/tmp/${ZIP_FILE_NAME}" "s3://${S3_BUCKET}/${S3_KEY}"
          echo "Uploaded to S3: s3://${S3_BUCKET}/${S3_KEY}"

      - name: Update Lambda function
        env:
          FUNCTION_NAME: ${{ steps.resolve-name.outputs.function_name }}
          S3_BUCKET: ${{ inputs.s3_bucket }}
          S3_KEY: ${{ inputs.s3_key }}
          AWS_REGION_INPUT: ${{ inputs.aws_region }}
        run: |
          aws lambda update-function-code \
            --function-name "${FUNCTION_NAME}" \
            --s3-bucket "${S3_BUCKET}" \
            --s3-key "${S3_KEY}" \
            --region "${AWS_REGION_INPUT}"
          echo "Lambda function updated successfully"

      - name: Wait for Lambda update to complete
        env:
          FUNCTION_NAME: ${{ steps.resolve-name.outputs.function_name }}
          AWS_REGION_INPUT: ${{ inputs.aws_region }}
        run: |
          echo "Waiting for Lambda function update to complete..."
          aws lambda wait function-updated \
            --function-name "${FUNCTION_NAME}" \
            --region "${AWS_REGION_INPUT}"
          echo "Lambda function is now active and updated"

      - name: Update Lambda description with version
        if: ${{ inputs.app_version != '' }}
        env:
          FUNCTION_NAME: ${{ steps.resolve-name.outputs.function_name }}
          APP_VERSION: ${{ inputs.app_version }}
          AWS_REGION_INPUT: ${{ inputs.aws_region }}
        run: |
          FUNC_NAME="${FUNCTION_NAME}"
          DESCRIPTION="Version: ${APP_VERSION} | Deployed: $(date -u +"%Y-%m-%dT%H:%M:%SZ") | Commit: ${GITHUB_SHA:0:7}"

          aws lambda update-function-configuration \
            --function-name "${FUNC_NAME}" \
            --description "${DESCRIPTION}" \
            --region "${AWS_REGION_INPUT}"

          echo "Updated description: ${DESCRIPTION}"

          aws lambda wait function-updated \
            --function-name "${FUNC_NAME}" \
            --region "${AWS_REGION_INPUT}"

      - name: Publish version
        if: ${{ inputs.publish_version }}
        id: publish-version
        env:
          FUNCTION_NAME: ${{ steps.resolve-name.outputs.function_name }}
        run: |
          RESULT=$(aws lambda publish-version \
            --function-name "${FUNCTION_NAME}" \
            --output json)

          VERSION=$(echo "$RESULT" | jq -r '.Version')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Published version: $VERSION"

      - name: Update alias
        if: ${{ inputs.update_alias != '' && inputs.publish_version }}
        env:
          FUNCTION_NAME: ${{ steps.resolve-name.outputs.function_name }}
          PUBLISHED_VERSION: ${{ steps.publish-version.outputs.version }}
          UPDATE_ALIAS: ${{ inputs.update_alias }}
        run: |
          FUNC_NAME="${FUNCTION_NAME}"
          VERSION="${PUBLISHED_VERSION}"

          if aws lambda get-alias \
            --function-name "$FUNC_NAME" \
            --name "${UPDATE_ALIAS}" \
            >/dev/null 2>&1; then
            aws lambda update-alias \
              --function-name "$FUNC_NAME" \
              --name "${UPDATE_ALIAS}" \
              --function-version "$VERSION"
          else
            aws lambda create-alias \
              --function-name "$FUNC_NAME" \
              --name "${UPDATE_ALIAS}" \
              --function-version "$VERSION"
          fi

          echo "Alias '${UPDATE_ALIAS}' now points to version $VERSION"

      - name: Verify deployment
        if: ${{ inputs.verify_deployment }}
        env:
          FUNCTION_NAME: ${{ steps.resolve-name.outputs.function_name }}
        run: |
          FUNC_INFO=$(aws lambda get-function \
            --function-name "${FUNCTION_NAME}" \
            --output json)

          STATE=$(echo "$FUNC_INFO" | jq -r '.Configuration.State')
          LAST_UPDATE=$(echo "$FUNC_INFO" | jq -r '.Configuration.LastUpdateStatus')

          echo "State: $STATE"
          echo "Last Update Status: $LAST_UPDATE"

          if [ "$STATE" != "Active" ] || [ "$LAST_UPDATE" != "Successful" ]; then
            echo "Deployment verification failed!"
            exit 1
          fi

          echo "Deployment verified successfully"

      - name: Smoke test
        if: ${{ inputs.smoke_test_payload != '' }}
        env:
          FUNCTION_NAME: ${{ steps.resolve-name.outputs.function_name }}
          UPDATE_ALIAS: ${{ inputs.update_alias }}
          PUBLISH_VERSION: ${{ inputs.publish_version }}
          SMOKE_TEST_PAYLOAD: ${{ inputs.smoke_test_payload }}
        run: |
          FUNC_NAME="${FUNCTION_NAME}"

          QUALIFIER=()
          if [ -n "${UPDATE_ALIAS}" ] && [ "${PUBLISH_VERSION}" == "true" ]; then
            QUALIFIER=(--qualifier "${UPDATE_ALIAS}")
          fi

          aws lambda invoke \
            --function-name "$FUNC_NAME" \
            "${QUALIFIER[@]}" \
            --payload "${SMOKE_TEST_PAYLOAD}" \
            --cli-binary-format raw-in-base64-out \
            /tmp/smoke-test-response.json

          echo "Response:"
          cat /tmp/smoke-test-response.json
          echo ""

      - name: Get Lambda function info
        env:
          FUNCTION_NAME: ${{ steps.resolve-name.outputs.function_name }}
          AWS_REGION_INPUT: ${{ inputs.aws_region }}
        run: |
          aws lambda get-function \
            --function-name "${FUNCTION_NAME}" \
            --region "${AWS_REGION_INPUT}" \
            --query 'Configuration.[FunctionName,LastModified,CodeSize,Version]' \
            --output table
